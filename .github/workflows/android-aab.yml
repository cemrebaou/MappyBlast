name: Android AAB

on:
  # sadece elle: Actions > Android AAB > Run workflow (kullanici 'tamam' deyince)
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Surum bilgisi
        run: |
          echo "SURUM_AD=${{ vars.SURUM_AD || '2.0' }}.${{ github.run_number }}" >> $GITHUB_ENV
          echo "SURUM_KODU=$(( ${{ vars.SURUM_TABAN || 2100000 }} + ${{ github.run_number }} ))" >> $GITHUB_ENV

      - name: Web dosyalari (www)
        run: |
          mkdir -p www
          cp index.html puzzle.html *.webp *.mp3 www/
          cp -r jump www/jump

      - name: Imza anahtari
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > mappy.keystore
            echo "KS_SIFRE=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KS_TAKMA=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "IMZA=gercek" >> $GITHUB_ENV
          else
            echo "::warning::KEYSTORE_BASE64 secret yok; gecici anahtar uretiliyor (Play'e yuklenemez)."
            keytool -genkeypair -v -keystore mappy.keystore -alias gecici -keyalg RSA -keysize 2048 -validity 10000 -storepass gecici123 -keypass gecici123 -dname "CN=Mappy, O=JAWK, C=TR"
            echo "KS_SIFRE=gecici123" >> $GITHUB_ENV
            echo "KS_TAKMA=gecici" >> $GITHUB_ENV
            echo "IMZA=gecici" >> $GITHUB_ENV
          fi
          echo "KS_DOSYA=$GITHUB_WORKSPACE/mappy.keystore" >> $GITHUB_ENV

      - name: Capacitor Android projesi
        run: |
          npm install
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#c9b6f2' --iconBackgroundColorDark '#c9b6f2' --splashBackgroundColor '#f6f1f6' --splashBackgroundColorDark '#f6f1f6'
          python3 android-ayar/ayarla.py
          npx cap sync android

      - name: AAB uret
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Imza kontrolu
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "SHA1|Owner" || true

      - uses: actions/upload-artifact@v5
        with:
          name: mappy-aab-${{ env.SURUM_AD }}-${{ env.IMZA }}
          path: android/app/build/outputs/bundle/release/app-release.aab
