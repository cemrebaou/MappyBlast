<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappy Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<script>
/* Android uygulaması mı (Capacitor)? Evetse <html class="native">: tam ekran tuşu yok, gerçek AdMob reklamı. */
(function () { try { var C = window.Capacitor; if (C && C.isNativePlatform && C.isNativePlatform()) document.documentElement.className += ' native'; } catch (e) {} })();
</script>
<style>
:root{
  /* Yerleşim: dikey telefon sahnesi. Üstte göstergeler, ortada kalın tepsi içinde
     resim kareler, altta iki resimli yardım tuşu. Sade açık zemin, tek güçlü şey tablo. */
  --page:linear-gradient(180deg,#faf6f8 0%,#f1e9f0 100%);
  --ink:#3a2a5e;
  --ink-dim:#6f6089;
  /* Baloo 2 = Latin + Devanagari; diğer yazılar için dil seçilince yüklenen aile + sistem yedekleri (kutu görünmesin) */
  --font:"Baloo 2","Nunito","Baloo Bhaijaan 2","Baloo Da 2","Noto Sans SC","Arial Rounded MT Bold",system-ui,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Naskh Arabic","Noto Nastaliq Urdu","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color-scheme:light;
  /* Tek ölçü birimi: 1u = min(genişlik/390, yükseklik/844) px (küçük telefonda en az 1 px).
     JS (fitLayout) kesin değeri yazar; bu satırlar yalnızca yedek. */
  --u:max(min(100vw / 390, 100vh / 844), min(1px, 100vw / 360));
  /* --uc: üst/alt blok (çubuklar, tuşlar, bant) birimi, --uc ≤ --u. fitLayout hesaplar. */
  --uc:var(--u);
}
@supports (height:100dvh){:root{--u:max(min(100vw / 390, 100dvh / 844), min(1px, 100vw / 360))}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#faf6f8;background:var(--page) fixed;
  color:var(--ink);
  font-family:var(--font);
  line-height:1;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:calc(3*var(--u)) solid #5c35aa;outline-offset:calc(3*var(--u))}
button:disabled{cursor:default}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- Arka plan: düz, açık ---------- */
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--page)}

/* ---------- Sahne ---------- */
.stage{
  /* sahne içinde --u = --uc: üst blok ve alt blok gerekirse küçülür, tablo tam genişlik kalır
     (tablo ölçüleri em = tablo genişliğinin %1'i, --u'ya bağlı değil) */
  --u:var(--uc);
  position:relative;z-index:1;
  height:100%;margin:0 auto;
  padding:calc(10*var(--u)) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  display:flex;flex-direction:column;gap:calc(8*var(--u));
  container-type:size;
}
.stage > *{flex:none}

/* ---------- Rakam resimleri (digitsHTML) ---------- */
.dg{display:inline-flex;align-items:center;line-height:0;white-space:nowrap}
.dg img{display:block;width:auto;flex:none}

/* ---------- Üst sıra ---------- */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:calc(6*var(--u))}
/* üst çubuk ve kural şeridi tablo çerçevesi genişliğinde (--bw, fitLayout) */
.top,.rules-slot{width:calc(var(--bw,100%) - calc(16*var(--u)));max-width:calc(100% - calc(16*var(--u)));align-self:center}
/* sol üst: ayarlar, duraklat, yeniden başlat tek sırada (360 px'te de en az 40 px) */
.top-left{display:flex;gap:calc(3*var(--u));align-items:flex-start}
.top-left .ui-btn img{height:max(40px,calc(42*var(--u)))}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:calc(6*var(--u))}
.ui-btn{
  border:0;padding:0;margin:0;background:none;line-height:0;border-radius:50%;
  transition:transform .1s,opacity .2s;
}
.ui-btn img{display:block;height:calc(50*var(--u));width:auto}
.ui-btn:active:not(:disabled){transform:scale(.92)}
.ui-btn:disabled{opacity:.55}
.level{display:flex;flex-direction:column;align-items:center;gap:calc(2*var(--u))}
.level{min-width:0}
/* plaka orta sütuna sığar (en çok 180u); yazı ve rakam plakayla orantılı (cqw) */
.plaque{
  position:relative;width:calc(180*var(--u));width:min(calc(180*var(--u)),100%);aspect-ratio:557/181;
  background:url(ui-baslik.webp) center/100% 100% no-repeat;
  container-type:inline-size;
}
/* krem iç alan: plakanın ortası */
.level-line{
  position:absolute;left:0;right:0;top:6%;bottom:10%;
  display:flex;align-items:center;justify-content:center;gap:calc(7*var(--u));gap:3.9cqw;
}
.level-k{
  font-size:calc(14*var(--u));font-size:9.4cqw;font-weight:800;letter-spacing:.1em;color:#8a4b3c;padding-top:1.7cqw;
}
.level-n img{height:calc(26*var(--u));height:17cqw}
/* plakanın altında canlar (çerçevesiz kalpler) */
.hearts{display:flex;gap:calc(3*var(--u));line-height:0;transition:filter .4s,opacity .4s}
.hearts img{display:block;height:calc(22*var(--u));width:auto}
.hearts.out{filter:grayscale(1);opacity:.55}
/* sayı paneli (ui-sayac): mor hap, altın kenar */
.panel{
  display:flex;align-items:center;justify-content:center;gap:calc(5*var(--u));
  background:url(ui-sayac.webp) center/100% 100% no-repeat;
}
.coins{height:calc(38*var(--u));min-width:calc(72*var(--u));padding:0 calc(10*var(--u)) 0 calc(7*var(--u))}
.coins .ico{height:calc(26*var(--u));width:auto;display:block;flex:none}
.coins .dg img{height:calc(18*var(--u))}


/* ---------- Kural şeridi: 3 küçük kart (mini 3x3 resim + yazı) ---------- */
.rules-slot{position:relative}
.rules{
  display:flex;gap:calc(6*var(--u));padding:calc(6*var(--u));border-radius:calc(16*var(--u));background:#fff;
  box-shadow:0 calc(3*var(--u)) 0 #e2d8ec,0 calc(6*var(--u)) calc(14*var(--u)) rgba(58,42,94,.10);
}
.rule{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:calc(5*var(--u));padding:calc(4*var(--u)) calc(4*var(--u)) calc(4*var(--u)) calc(5*var(--u));border-radius:calc(11*var(--u));background:#f7f2f9}
.mini3{flex:none;display:grid;grid-template-columns:repeat(3,calc(12*var(--u)));gap:calc(1*var(--u));line-height:0}
.mini3 > span{position:relative;display:block;width:calc(12*var(--u));height:calc(12*var(--u))}
.mini3 img{display:block;width:calc(12*var(--u));height:calc(12*var(--u))}
.mini3 .rm{position:absolute;left:50%;top:50%;width:88%;aspect-ratio:1;transform:translate(-50%,-55%);
  background:url(fare-idle.webp) 0 0/800% 200% no-repeat}
.rule p{margin:0;min-width:0;font-size:calc(12*var(--u));font-weight:700;line-height:1.1;color:var(--ink)}

/* ---------- Oyun alanı: bölge sekmesi + tablo + yardım tuşları; kalan yüksekliği doldurur ---------- */
.play{
  flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  container-type:size;
}

/* ---------- Tablo ---------- */
/* genişlik: 100cqh - yardım çubuğu (76 + 14) = sekme + tablo; sekme ≈ tablo × (47.7/n + 1.4)% */
.board-wrap{
  width:calc(366*var(--u));
  width:max(calc(200*var(--u)),min(100cqw,(100cqh - calc(92*var(--u))) / (1.018 + .477 / var(--n,6))));
  container-type:inline-size;
}
/* bölge sekmesi: çerçevenin üst kenarına yapışık, her bölgeye bir mini kare */
.reg-tab{
  font-size:calc(3.4*var(--u));font-size:1cqw;
  position:relative;z-index:2;display:flex;justify-content:center;gap:.8em;
  width:max-content;max-width:100%;margin:0 auto -1.3em;
  padding:.9em 1.6em 1.8em;border-radius:3.2em 3.2em 0 0;
  background:linear-gradient(180deg,#f3f0fa 0%,#e9e5f4 100%);
  box-shadow:inset 0 .5em .3em rgba(255,255,255,.9);
}
.reg-mini{position:relative;flex:none;width:calc(47.7em / var(--n,6));aspect-ratio:1}   /* = kare / 2 */
.reg-mini img{display:block;width:100%;height:100%}
.reg-mini .mpet{
  position:absolute;left:50%;top:50%;width:87.8%;aspect-ratio:1;
  transform:translate(-50%,calc(-50% - calc(1*var(--u))));background-repeat:no-repeat;
  filter:drop-shadow(0 .25em .3em rgba(0,0,0,.35));
}
.tray{
  font-size:calc(3.4*var(--u));font-size:1cqw;           /* 1em = tablo genişliğinin %1'i */
  position:relative;
  padding:1.3em;border-radius:9em;
  /* farenin halkasıyla aynı: açık lila-gri, yumuşak parlak */
  background:linear-gradient(165deg,#f1eef9 0%,#dedaef 25%,#c9c5da 60%,#b5b0c8 85%,#d4d0e3 100%);
  box-shadow:
    inset 0 .5em .3em rgba(255,255,255,.9),
    inset 0 -.6em .9em rgba(90,80,120,.3),
    0 1.4em 0 #a39db8,
    0 4.5em 6em rgba(80,70,110,.25);
}
/* iç zemin: farenin deliğinde farenin arkasındaki açık ton (~#3f3640), biraz daha aydınlık */
.well{
  position:relative;z-index:1;border-radius:7.6em;
  padding:1em;
  background:#433a48;
  background:radial-gradient(farthest-corner at 50% 50%, #4a4152 0%, #3b3341 100%);
  box-shadow:
    inset 0 1.2em 1.6em rgba(0,0,0,.38),
    inset 0 -.3em .4em rgba(255,255,255,.07);
}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}

/* hücre = gerçek tuş; içinde bölge rengindeki resim kare */
.cell{
  position:relative;display:block;width:100%;aspect-ratio:1;
  margin:0;padding:0;border:0;background:none;border-radius:22%;
}
.cell:focus-visible{outline:.7em solid #fff4c2;outline-offset:-.5em}
.cell.lift{z-index:3}
.tile{
  position:absolute;left:1.5%;top:1.5%;width:97%;height:97%;display:block;
  pointer-events:none;transition:filter .5s ease;
}
.tile.bad{filter:grayscale(1);transition:none}
.tile.pop{animation:pop .22s ease-out}
.tile.shake{animation:shake .35s linear}
@keyframes pop{0%{transform:scale(.84)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7%)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(2%)}}

/* ipucu ile işaretlenen kare: kısa sarı parıltı */
.cell.glow::after{
  content:"";position:absolute;inset:1%;border-radius:24%;pointer-events:none;
  border:.5em solid #fff4c2;
  box-shadow:0 0 2.2em .5em rgba(255,206,90,.95), inset 0 0 1.4em rgba(255,236,170,.85);
  animation:glow .6s ease-in-out 2 both;
}
@keyframes glow{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

/* fare: halka çapı = kare genişliği; sprite kutusu resim karenin %87.8'i (97 × .878), ortalı */
.pet{
  position:absolute;left:50%;top:50%;width:85.2%;aspect-ratio:1;
  transform:translate(-50%,calc(-50% - calc(2*var(--u))));pointer-events:none;   /* halka merkezi, 2 px yukarı */
  background-repeat:no-repeat;
  filter:drop-shadow(0 .5em .6em rgba(0,0,0,.45));
}

/* ---------- Alt tuşlar: ampul (ipucu) + büyüteç ---------- */
.tools{display:flex;justify-content:center;align-items:flex-end;gap:calc(144*var(--u));
  /* ~2 tuş genişliği; dar çerçevede sağ alttaki tam ekran tuşuna yer bırakır */
  gap:max(calc(16*var(--u)),min(calc(72*var(--u)),(var(--bw,100vw) - calc(320*var(--u))) / 2));margin-top:calc(14*var(--u));flex:none}
.img-btn{
  position:relative;border:0;padding:0;margin:0;background:none;line-height:0;border-radius:50%;
  transition:transform .1s,opacity .2s,filter .2s;
}
.img-btn > img{display:block;width:calc(72*var(--u));height:calc(72*var(--u))}
.img-btn:active:not(:disabled){transform:translateY(calc(2*var(--u))) scale(.97)}
.img-btn:disabled{opacity:.55;filter:grayscale(.35)}
.img-btn > .badge{
  position:absolute;top:calc(-4*var(--u));right:calc(-4*var(--u));left:auto;bottom:auto;
  width:calc(28*var(--u));height:calc(28*var(--u));min-width:0;max-width:none;padding:0;margin:0;
  display:flex;align-items:center;justify-content:center;line-height:0;overflow:visible;
  background:url(ui-rozet.webp) center/100% 100% no-repeat;
}
.img-btn > .badge .dg{display:inline-flex;height:calc(18*var(--u))}
.img-btn > .badge .dg img{display:block;width:auto;height:calc(18*var(--u));max-width:none}
.img-btn > .badge.plus{background:none}
.img-btn > .badge.plus img{display:block;width:calc(28*var(--u));height:calc(28*var(--u))}

/* ---------- Alt reklam bandı (60 px, ileride banner) + sağ alt tam ekran ---------- */
.ad-band{height:calc(60*var(--u));margin:0;display:flex;align-items:center;justify-content:center}
.sim-banner{width:var(--bw,100%);max-width:100%;height:calc(50*var(--u));display:flex;align-items:center;justify-content:center;
  background:#e4e1e8;color:#8a8494;font-size:calc(12*var(--u));font-weight:700;letter-spacing:.06em}
.fs-btn{position:absolute;right:calc((100% - var(--bw,100%)) / 2 + calc(8*var(--u)));bottom:calc(66*var(--u));z-index:3}
.fs-btn img{display:block;height:calc(44*var(--u));width:auto}

/* ---------- Kaplama kartları (kazandın / can bitti / reklam / duraklat) ---------- */
.overlay{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(20*var(--u));
  background:rgba(58,42,94,.38);
}
.overlay[hidden]{display:none}
.card{
  --cw:min(88vw,calc(360*var(--u)));
  position:relative;width:var(--cw);aspect-ratio:645/375;
  /* içerik krem alanda */
  padding:calc(var(--cw) * .1) 9% calc(var(--cw) * .08);
  text-align:center;color:var(--ink);
  background:url(ui-kart.webp) center/100% 100% no-repeat;
  animation:cardIn .22s ease-out;
}
@keyframes cardIn{from{transform:translateY(calc(12*var(--u))) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 calc(8*var(--u));font-size:calc(28*var(--u));font-size:min(calc(28*var(--u)),7.4vw);white-space:nowrap;font-weight:800;line-height:1.1;color:#3a1d7a}
.card p{margin:0 0 calc(12*var(--u));font-size:calc(18*var(--u));font-weight:600;line-height:1.3;color:var(--ink)}
.card p b{color:#3a1d7a;font-weight:800}
.card .acts{display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--u))}
/* yan yana iki tuş: solda Tekrar oyna, sağda Sonraki bölüm */
.card .acts.pair{flex-direction:row;justify-content:center;gap:calc(8*var(--u))}
.card .acts.pair button{flex:1 1 0;min-width:0;max-width:calc(150*var(--u));height:calc(50*var(--u));padding:calc(3*var(--u)) calc(8*var(--u)) 0;font-size:calc(16*var(--u));font-size:min(calc(17*var(--u)),4.3vw);white-space:nowrap}
.ad-btn{border:0;padding:calc(4*var(--u));margin:0;background:none;border-radius:calc(22*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(6*var(--u))}
.ad-btn img{display:block;width:calc(72*var(--u));height:calc(72*var(--u));border-radius:50%;transition:transform .1s}
.ad-btn .cap{font-size:calc(18*var(--u));font-weight:800;line-height:1.15;color:var(--ink);max-width:11em}
.ad-btn:active img{transform:scale(.94)}
/* yuvarlak simge tuşları (duraklat / ayarlar / can bitti kartı) */
.icon-row{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:calc(10*var(--u)) calc(16*var(--u))}
.ic-btn{border:0;padding:calc(4*var(--u));margin:0;background:none;border-radius:calc(18*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(5*var(--u));min-width:calc(72*var(--u))}
.ic-btn img{display:block;width:calc(60*var(--u));height:calc(60*var(--u));border-radius:50%;transition:transform .1s}
.ic-btn .cap{font-size:calc(15*var(--u));font-weight:800;line-height:1.1;color:var(--ink)}
.ic-btn:active img{transform:scale(.92)}
.ic-btn.close-x img{width:calc(52*var(--u));height:calc(52*var(--u))}
.card .close-row{display:flex;justify-content:center;margin-top:calc(10*var(--u))}
/* duraklat / ayarlar: dikey satır listesi (simge solda, yazı sağda) */
.card.menu{
  aspect-ratio:auto;min-height:calc(var(--cw) * 375 / 645);
  display:block;
  padding:calc(var(--cw) * .1) 8% calc(var(--cw) * .09);
}
.card.menu h2{margin:0 0 calc(12*var(--u));text-align:center}
/* her yerde aynı çalışsın diye: liste ortada sabit genişlikte blok, tuşun içi ayrı span'da flex */
.row-list{display:block;width:calc(216*var(--u));max-width:100%;margin:0 auto}
.row-btn{
  display:block;width:100%;min-height:calc(56*var(--u));margin:0 0 calc(12*var(--u));
  border:0;padding:0;background:none;border-radius:calc(28*var(--u));text-align:left;
}
.row-btn:last-child{margin-bottom:0}
.rb-in{display:flex;align-items:center;width:100%}
.row-btn img{display:block;flex:0 0 calc(56*var(--u));width:calc(56*var(--u));height:calc(56*var(--u));border-radius:50%;margin-right:calc(12*var(--u));margin-inline-end:calc(12*var(--u));margin-inline-start:0;transition:transform .1s}
.card[dir=rtl] .row-btn{text-align:right}
/* harf aralığı bitişik / hece yazılarını bozar */
html:lang(ar) *,html:lang(ur) *,html:lang(hi) *,html:lang(bn) *,html:lang(zh-Hans) *{letter-spacing:0 !important}
.row-btn .cap{flex:1 1 auto;min-width:0;font-size:calc(20*var(--u));font-weight:800;line-height:1.1;color:var(--ink);white-space:nowrap}
.row-btn .st{flex:0 0 auto;margin-left:calc(8*var(--u));font-size:calc(14*var(--u));font-weight:700;line-height:1;color:var(--ink-dim);white-space:nowrap}
.row-btn:active img{transform:scale(.92)}
/* ---------- Kazanma / kaybetme karakteri: kartın üstünde, üst kenarına biraz basarak durur ---------- */
.card.has-celeb{--celh:calc(168*var(--u));--celov:calc(26*var(--u));margin-top:calc(var(--celh) - var(--celov))}
.celeb{position:absolute;left:50%;bottom:calc(100% - var(--celov));z-index:3;height:var(--celh);width:calc(var(--celh) * 1.5);
  transform:translateX(-50%);display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.celeb-halo{position:absolute;left:50%;top:54%;width:calc(var(--celh) * 1.45);height:calc(var(--celh) * 1.12);transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,252,238,.92) 0,rgba(255,240,250,.62) 45%,rgba(236,226,255,.28) 72%,rgba(255,255,255,0) 100%);
  -webkit-backdrop-filter:blur(calc(7*var(--u)));backdrop-filter:blur(calc(7*var(--u)));
  -webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 55%,transparent 100%)}
.celeb-sp{position:relative;display:block;height:100%;width:auto;background-repeat:no-repeat;
  filter:drop-shadow(0 calc(3*var(--u)) calc(4*var(--u)) rgba(58,42,94,.25))}
.card.has-celeb{padding-top:calc(var(--cw) * .1 + 12*var(--u));padding-bottom:calc(var(--cw) * .08 + 8*var(--u))}
/* kazandın kartı: kupa */
.win-cup{display:block;height:calc(54*var(--u));width:auto;margin:0 auto calc(4*var(--u))}
/* yerleşik reklam kartı (SDK yokken) */
.ad-bar{width:80%;height:calc(12*var(--u));margin:calc(10*var(--u)) auto calc(2*var(--u));border-radius:calc(6*var(--u));background:#e6d9f3;overflow:hidden}
.ad-bar i{display:block;width:100%;height:100%;border-radius:calc(6*var(--u));background:#7a4fc8;transform-origin:left center;animation:adBar 2s linear both}
@keyframes adBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card:focus{outline:none}
.main-btn,.txt-btn{

function toLevel(pz) {
  var n = pz.n, regions = [], r, c;
  for (r = 0; r < n; r++) { regions.push([]); for (c = 0; c < n; c++) regions[r].push(pz.regions[r * n + c]); }
  var score = typeof pz.score === 'number' ? pz.score : rate(n, pz.regions).score;
  return { L: pz.L || 0, size: n, regions: regions, solution: pz.solution.slice(), tiles: pz.tiles,
           score: score, boss: !!pz.boss };
}

function newState() {
  var n = LEVEL.size, cells = [], r, c;
  for (r = 0; r < n; r++) { cells.push([]); for (c = 0; c < n; c++) cells[r].push('closed'); }
  return {
    cells: cells, found: 0, lives: START_LIVES,
    status: 'play',                  /* 'play' | 'won' | 'over' */
    ms: 0, since: 0,                 /* süre: biriken ms + çalışıyorsa başlangıç anı */
    mistakes: 0, bulbs: 0, glasses: 0
  };
}

function tileSrc(r, c, kind) { return kind + '-' + LEVEL.tiles[regionOf(r, c)] + '.webp'; }
function canPlay() { return S && S.status === 'play' && !overlayOpen && !(tut && tut.busy); }
function fx(fn, ms) { var t = setTimeout(fn, ms); fxTimers.push(t); return t; }
function clearFx() { for (var i = 0; i < fxTimers.length; i++) clearTimeout(fxTimers[i]); fxTimers = []; }
function restartClass(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function fmtCoins(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

/* ---------- resim rakamlar ---------- */
var DIGIT_W = { '0':53, '1':44, '2':41, '3':48, '4':53, '5':49, '6':50, '7':49, '8':49, '9':48, '/':44, ':':35 };
var DIGIT_FILE = { '/':'bolu', ':':'iki-nokta' };
/* "0-9 / :" dizisini rakam resimlerine çevirir (64 px yüksek kaynaklar); diğer karakterler atlanır */
function digitsHTML(str, h, label) {
  str = String(str);
  var out = '', i, ch;
  for (i = 0; i < str.length; i++) {
    ch = str.charAt(i);
    if (!DIGIT_W.hasOwnProperty(ch)) continue;
    out += '<img src="rakam-' + (DIGIT_FILE[ch] || ch) + '.webp" width="' + Math.round(DIGIT_W[ch] * h / 64) +
           '" height="' + h + '" alt="" aria-hidden="true">';
  }
  return '<span class="dg" role="img" aria-label="' + (label || str) + '">' + out + '</span>';
}
function setDigits(el, str, h, label) {
  var key = str + '|' + (label || '');
  if (el.getAttribute('data-v') === key) return;
  el.setAttribute('data-v', key);
  el.innerHTML = digitsHTML(str, h, label);
}
function starsHTML(n) {
  var html = '', i;
  for (i = 1; i <= 3; i++) {

/* plakadaki kelime (BÖLÜM / çevirisi) rakamlarla birlikte krem alana sığsın: 9.4cqw'den gerektiği kadar küçülür */
function fitPlaque() {
  var k = $('levelK'), n = $('levelNo'), line = k.parentNode;
  k.style.fontSize = '';
  if (!line || !line.clientWidth) return;
  var gap = parseFloat(window.getComputedStyle(line).columnGap) || 0;
  var avail = line.clientWidth * 0.84 - (n.offsetWidth ? n.offsetWidth + gap : 0), kw = k.offsetWidth;
  if (kw > avail && kw > 0) k.style.fontSize = Math.max(5, 9.4 * avail / kw).toFixed(2) + 'cqw';
}

function elapsed() { return S.ms + (S.since ? Date.now() - S.since : 0); }
function fmtTime(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  s = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
/* oyun sürüyorsa ve kart açık değilse saat işler (ekranda gösterilmez; yıldız, ZP, kazandın kartı) */
function syncClock() {
  if (S.since) { S.ms += Date.now() - S.since; S.since = 0; }
  if (S.status === 'play' && !overlayOpen) S.since = Date.now();
}

/* =====================================================================
   J. İLERLEME: bölüm başlatma, önceden üretme, bölüm sonu
   ===================================================================== */
function puzzleFor(L) {
  var pz = null;
  if (pre && pre.fits(L, P.zp)) pz = pre.run();          /* hazırsa anında, değilse bitirir */
  if (!pz) { try { pz = new GenJob(P.profileSeed, L, P.zp).run(); } catch (e) { pz = null; } }
  if (!pz) {                                                /* yedek */
    pz = { n: FALLBACK_LEVEL.n, regions: FALLBACK_LEVEL.regions.slice(), solution: FALLBACK_LEVEL.solution.slice(),
           tiles: FALLBACK_LEVEL.tiles.slice(), L: L, boss: false };
    pz.score = rate(pz.n, pz.regions).score;
  }
  pz.L = L;
  pre = null;
  return pz;
}

/* sonraki bölümü küçük parçalarla arka planda üretir */
function pregen(L) {
  if (pre && pre.fits(L, P.zp)) return;
  var job = pre = new GenJob(P.profileSeed, L, P.zp);
  function tick() {
    if (pre !== job || job.done) return;
    if (!job.step()) setTimeout(tick, 16);
  }
  setTimeout(tick, 600);
}

function startGameLevel(L) {
  var pz = (P.cur && P.cur.L === L && P.cur.regions && P.cur.regions.length === P.cur.n * P.cur.n) ? P.cur : puzzleFor(L);
  P.cur = pz;
  save();
  begin(pz, 'play');
  pregen(L + 1);
}

/* aynı bulmacayı (yeniden) başlatır */
function begin(pz, mode) {
  endTutorialUI();
  PUZ = pz;
  MODE = mode;
  LEVEL = toLevel(pz);
  if (mode === 'play') bump('levelsPlayed');
  resetLevel();
}

function resetLevel() {
  clearFx();
  clearPetTimers();
  spritesWaiting = [];
  if (overlayOpen) closeOverlay();
  S = newState();
  renderStatic();
  Ads.banner();
  buildBoard();
  syncClock();
  updateHud();
}

function onLevelWon() {
  S.status = 'won';
  syncClock();
  if (MODE === 'tut') { fx(showTutWin, REDUCED ? 400 : 1500); updateHud(); return; }
  var stars = starsFor(S.mistakes, S.glasses), coins = 0;
  if (MODE === 'play') {
    coins = coinsFor(stars, LEVEL.boss);
    P.zp = zpAfterLevel(P.zp, LEVEL.size, LEVEL.score, elapsed(), S.mistakes, S.bulbs, S.glasses);
    P.coins += coins;
    P.level = LEVEL.L + 1;
    P.cur = null;
    P.consecutiveGameOvers = 0;
    P.counters.levelsWon++;
    Ads.noteWin();
  }
  P.lastStars = stars;
  save();
  pregen(P.level);                  /* ZP değişti: gerekirse yeniden üretir */
  updateHud();
  fx(function () { renderStatic(); showWin(stars, coins); }, REDUCED ? 400 : 1500);
}

function onGameOver() {
  S.status = 'over';
  syncClock();
  P.counters.deaths++;
  P.adDeaths++;
  P.consecutiveGameOvers++;
  if (P.consecutiveGameOvers >= 2) { P.zp = clamp(P.zp - 10, 0, 100); P.consecutiveGameOvers = 0; }
  save();
  fx(showGameOver, 800);
}

function paintCell(r, c) {
  var st = S.cells[r][c], v = view.cells[r][c];
    if (st !== 'mouse') {
    var src = tileSrc(r, c, st === 'paw' ? 'pati' : 'kare');

  } else if (!v.pet) {
    /* fare açılınca altındaki kare çatlak (pati) kareye döner; halka patiyi örter, çatlaklar görünür */

    v.pet.setAttribute('aria-hidden', 'true');
    v.btn.appendChild(v.pet);
    startPet(v.pet);
    var mini = view.minis[regionOf(r, c)];
    if (mini && !mini.on) { mini.on = true; startPet(mini.pet); }

  v.btn.setAttribute('aria-label', t('cell', r + 1, c + 1, t(CELL_LABEL[st])));
}

/* çerçevenin üstündeki sekme: bölge sırasıyla her bölgenin düz karesi + boş delik (çıkış karesi 0);

/* ---------- fare sprite oynatıcı ---------- */
var petTimers = [];
var spritesReady = false, spritesWaiting = [];

function petLater(fn, ms) {
  var t = setTimeout(function () {
    var i = petTimers.indexOf(t);
    if (i >= 0) petTimers.splice(i, 1);
    fn();
  }, ms);
  petTimers.push(t);
  return t;
}
function clearPetTimers() { for (var i = 0; i < petTimers.length; i++) clearTimeout(petTimers[i]); petTimers = []; }

function setPetFrame(el, sp, f) {
  var col = f % sp.cols, row = Math.floor(f / sp.cols);
  var x = sp.cols > 1 ? col / (sp.cols - 1) * 100 : 0;
  var y = sp.rows > 1 ? row / (sp.rows - 1) * 100 : 0;
  el.style.backgroundImage = 'url(' + sp.src + ')';
  el.style.backgroundSize = (sp.cols * 100) + '% ' + (sp.rows * 100) + '%';
  el.style.backgroundPosition = x + '% ' + y + '%';
}

/* Bir sprite'ı oynatır; loops kez döner (Infinity = sonsuz), bitince onDone */
function playSprite(el, sp, loops, onDone) {
  var f = 0, done = 0;
  function step() {
    if (!el.isConnected) return;
    setPetFrame(el, sp, f);
    var d = sp.durations[f] || 100;
    if (d < 20) d = 100;
    petLater(function () {
      f++;
      if (f >= sp.frames) { f = 0; done++; if (done >= loops) { if (onDone) onDone(); return; } }
      step();
    }, d);
  }
  step();
}

/* çıkış bir kez, sonra idle (idleLoops yoksa sonsuz) */
function playPet(el, onDone, idleLoops) {
  if (REDUCED) { setPetFrame(el, SPRITES.idle, 0); if (onDone) onDone(); return; }
  playSprite(el, SPRITES.emerge, 1, function () {
    playSprite(el, SPRITES.idle, idleLoops || Infinity, onDone);
  });
}

function loopTime(sp) {
  var t = 0;
  for (var i = 0; i < sp.frames; i++) t += (sp.durations[i] < 20 ? 100 : sp.durations[i]);
  return t;
}

function startPet(el) {
  function go() {
    if (REDUCED) { setPetFrame(el, SPRITES.idle, 0); return; }
    if (DEMO_LOOP) {
      var n = Math.max(3, Math.ceil(3000 / loopTime(SPRITES.idle)));
      var again = function () { playPet(el, again, n); };
      again();
    } else {
      playPet(el);
    }
  }
  if (spritesReady) go(); else spritesWaiting.push(go);
}

   ===================================================================== */
/* Tek dokunuş: pati koy / kaldır (hemen, doğrulanmaz, bedava).
   Aynı kareye DOUBLE_TAP_MS içinde 2. dokunuş: 1. dokunuşun değişikliği geri alınır, kare açılır. */
var DOUBLE_TAP_MS = 300;
var lastTap = null;                /* { v, s, t, prev } : son tek dokunuş */
function onCellClick(e) {
  var btn = e.target.closest ? e.target.closest('.cell') : null;
  if (!btn || !canPlay()) return;
  var r = +btn.getAttribute('data-r'), c = +btn.getAttribute('data-c');
  if (MODE === 'tut' && !tutAllows(r, c)) return;
  var v = view.cells[r][c];
  if (v.busy) return;
  var st = S.cells[r][c];
  if (st === 'mouse') { lastTap = null; return; }        /* açık fare: hiçbir şey */
  var now = Date.now();
  if (lastTap && lastTap.v === v && lastTap.s === S && now - lastTap.t <= DOUBLE_TAP_MS) {
    /* çift dokunuş: kareyi aç */
    S.cells[r][c] = lastTap.prev;
    lastTap = null;
    paintCell(r, c);
    if (isMouse(r, c)) revealMouse(r, c);
    else mistake(r, c);
    return;
  }
  lastTap = { v: v, s: S, t: now, prev: st };
  S.cells[r][c] = st === 'paw' ? 'closed' : 'paw';
  paintCell(r, c);
  playPop();
  if (!REDUCED) restartClass(v.img, 'pop');
}

/* ---------- Sesler ---------- */
var SOUNDS = { fare: 'ses-fare.mp3', tap: 'pop-1.mp3', pop1: 'pop-1.mp3', pop2: 'pop-2.mp3', pop3: 'pop-3.mp3', pop4: 'pop-4.mp3', pop5: 'pop-5.mp3', pop6: 'pop-6.mp3', pop7: 'pop-7.mp3', pop8: 'pop-8.mp3' }, SOUND_CACHE = {};
/* pati sesi: 8 pop sırayla, sonra başa */
var POP_I = 0;
function playPop() { POP_I = POP_I % 8 + 1; playSound('pop' + POP_I); }
/* Ayarlar'da "Ses" kapalıysa hiçbir efekt çalmaz; vol verilmezse 1 */
function playSound(name, vol) {
  if (!P.sfx) return;
  try {
    var base = SOUND_CACHE[name];
    if (!base) { base = SOUND_CACHE[name] = new Audio(SOUNDS[name]); base.preload = 'auto'; }
    var a = base.paused ? base : base.cloneNode(true);
    a.volume = vol == null ? 1 : vol;        /* cloneNode ses düzeyini taşımaz: her seferinde ver */
    a.currentTime = 0;
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}
(function () { for (var k in SOUNDS) { try { SOUND_CACHE[k] = new Audio(SOUNDS[k]); SOUND_CACHE[k].preload = 'auto'; } catch (e) {} } })();
/* Ayarlar'da "Titreşim" kapalıysa titremez */
function vibrate(ms) { try { if (P.vibe && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- Arka plan müziği ----------
   Tek Audio, döngüde, %35. Tarayıcı kuralı: ilk dokunuştan önce çalınamaz (unlock).
   want = müzik açık + kilit açık + reklam oynamıyor + sayfa görünür. */
var Music = {
  el: null, unlocked: false, held: false, ducked: false,
  init: function () {
    try { this.el = new Audio('muzik.mp3'); this.el.loop = true; this.el.volume = 0.35; this.el.preload = 'auto'; } catch (e) { this.el = null; }
  },
  sync: function () {
    var a = this.el;
    if (!a) return;
    var want = P.music && this.unlocked && !this.held && !this.ducked && !document.hidden;
    if (want && a.paused) { try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    else if (!want && !a.paused) a.pause();
  },

/* ---------- Kazanma / kaybetme karakteri (kartın üstünde duran animasyonlu fare + ses) ----------

   Sesler Ses ayarına uyar; ses çalarken müzik susar (Music.duck), kart kapanınca geri gelir. */
var CELEB_PFX = '';

  alkis:   { src: 'kutlama-alkis.webp',   cw: 160, ch: 240, ms: 140, snd: 'ses-alkis.mp3' },
  duduk:   { src: 'kutlama-duduk.webp',   cw: 175, ch: 240, ms: 140, snd: 'ses-duduk.mp3' },

};
var CELEB_WIN = ['alkis', 'duduk', 'trampet'];
var Celeb = {
  key: null, lastWin: null, timer: null, gen: 0, lose: false, loopOn: false,
  imgs: [], aud: {}, loaded: false,
  /* oyun başladıktan sonra çağrılır: ilk kazanmada boş görünmesin */
  preload: function () {
    if (this.loaded) return;

    for (var k in CELEB) if (CELEB.hasOwnProperty(k)) {
      var im = new Image(); im.src = CELEB_PFX + CELEB[k].src; this.imgs.push(im);

  },
  audio: function (f) {

    if (!a) { try { a = this.aud[f] = new Audio(CELEB_PFX + f); a.preload = 'auto'; } catch (e) { a = null; } }
    return a;
  },
  pickWin: function () {
    var opts = [], i;
    for (i = 0; i < CELEB_WIN.length; i++) if (CELEB_WIN[i] !== this.lastWin) opts.push(CELEB_WIN[i]);
    var k = opts[Math.floor(Math.random() * opts.length)];

    return k;
  },
  /* kartın HTML'inin başına eklenir; kart sınıfına 'has-celeb' verilir */
  html: function (key) {

           '<span class="celeb-sp" style="aspect-ratio:' + c.cw + '/' + c.ch + '"></span></div>';
  },
  frame: function (el, c, f) {
    var col = f % 6, row = Math.floor(f / 6);
    el.style.backgroundImage = 'url(' + CELEB_PFX + c.src + ')';
    el.style.backgroundSize = '600% 200%';
    el.style.backgroundPosition = (col / 5 * 100) + '% ' + (row * 100) + '%';

  /* kart açıldıktan sonra: animasyon + ses. quiet: ağlama sesi çalmadan doğrudan döngü (reklam yoktan dönüş) */
  start: function (key, quiet) {
    this.stop();
    this.preload();
    var self = this, c = CELEB[key], el = document.querySelector('#card .celeb-sp'), f = 0, g = this.gen;
    this.key = key;
    this.lose = key === 'aglama';
    if (el) {
      if (REDUCED) this.frame(el, c, 0);
      else (function step() {
        if (g !== self.gen || !el.isConnected) return;

        f = (f + 1) % 12;
        self.timer = setTimeout(step, c.ms);

    if (!P.sfx) return;
    if (this.lose && quiet) { this.startLoop(); return; }
    var a = this.audio(c.snd);
    if (!a) { if (this.lose) this.startLoop(); return; }
    Music.duck(true);

  silence: function () {
    for (var f in this.aud) if (this.aud.hasOwnProperty(f) && this.aud[f]) {

  },
  /* kart kapanınca / başka kart açılınca / reklam başlarken */
  stop: function () {

/* Açılmış bir farenin dışladığı mı? (aynı satır, sütun, bölge ya da 8 komşu) */
function excludedByMouse(r, c) {
  for (var k = 0; k < LEVEL.size; k++) {
    var mc = LEVEL.solution[k];
    if (S.cells[k][mc] !== 'mouse') continue;
    if (r === k || c === mc || regionOf(r, c) === regionOf(k, mc) ||
        (Math.abs(r - k) <= 1 && Math.abs(c - mc) <= 1)) return true;
  }
  return false;
}

/* En çok max kare seçer; asla fare karesi seçmez */
function hintTargets(max) {
  var n = LEVEL.size, picks = [], taken = {}, r, c;
  function free(r, c) { return S.cells[r][c] === 'closed' && !isMouse(r, c) && !taken[r * n + c]; }
  function take(r, c) { taken[r * n + c] = true; picks.push([r, c]); }

  /* (a) açık farelerin dışladığı kareler */
  for (r = 0; r < n && picks.length < max; r++)
    for (c = 0; c < n && picks.length < max; c++)
      if (free(r, c) && excludedByMouse(r, c)) take(r, c);

  /* (b) kalan: en az kapalı karesi kalmış satır/sütun/bölgedeki kareler önce */
  while (picks.length < max) {
    var row = [], col = [], reg = [], i;
    for (i = 0; i < n; i++) { row.push(0); col.push(0); reg.push(0); }
    for (r = 0; r < n; r++) for (c = 0; c < n; c++)
      if (S.cells[r][c] === 'closed' && !taken[r * n + c]) { row[r]++; col[c]++; reg[regionOf(r, c)]++; }
    var best = null, bestScore = Infinity;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (!free(r, c)) continue;
      var score = Math.min(row[r], col[c], reg[regionOf(r, c)]);
      if (score < bestScore) { bestScore = score; best = [r, c]; }
    }
    if (!best) break;
    take(best[0], best[1]);
  }
  return picks;
}

  /* açılmamış fareler arasından bölgesinde en az (kapalı + pati) kare kalanı */
  var n = LEVEL.size, best = -1, bestLeft = Infinity, r, k, c;

    var mc = LEVEL.solution[r];

    if (left < bestLeft) { bestLeft = left; best = r; }

  revealMouse(best, LEVEL.solution[best]);

/* fare açıldı: dışlanan kareler sırayla pati olur, sonra sonraki adım */
function tutOnReveal(r, c) {
  var st = TUT_STEPS[tut.step];
  tutPoint(null);
  function next() {
    if (!tut) return;
    tut.step++;
    tut.busy = false;
    tutShowStep();
    updateHud();
  }
  if (!st.teach) { next(); return; }
  var n = LEVEL.size, g = regionOf(r, c), done = {};
  function group(test) {
    var out = [], k, m;
    for (k = 0; k < n; k++) for (m = 0; m < n; m++)
      if (!done[k * n + m] && S.cells[k][m] === 'closed' && test(k, m)) { out.push([k, m]); done[k * n + m] = 1; }
    return out;
  }
  var groups = [
    [t('tutRow'), group(function (k) { return k === r; })],
    [t('tutCol'), group(function (k, m) { return m === c; })],
    [t('tutColor'), group(function (k, m) { return regionOf(k, m) === g; })],
    [t('rule3'), group(function (k, m) { return Math.abs(k - r) <= 1 && Math.abs(m - c) <= 1; })]
  ];
  tut.busy = true;
  updateHud();
  var tm = REDUCED ? 300 : 1300, gi, ci;
  for (gi = 0; gi < groups.length; gi++) {
    if (!groups[gi][1].length) continue;
    (function (gr, at) {
      fx(function () { tutSay(gr[0]); }, at);
      for (ci = 0; ci < gr[1].length; ci++) (function (cell, at2) {
        fx(function () { markPaw(cell[0], cell[1]); }, at2);
      })(gr[1][ci], at + 350 + ci * 120);
    })(groups[gi], tm);
    tm += 350 + groups[gi][1].length * 120 + 1300;
  }
  fx(function () { tutSay(t('tutTap')); }, tm);
  tm += REDUCED ? 600 : 2200;
  fx(next, tm);
}

  function retry(kind, fn) {

    timers[kind] = setTimeout(fn, ms);
  }
  function loadInt() {
    if (!st.started || st.intReady || st.intLoading) return;
    st.intLoading = true;
    call('prepareInterstitial', { adId: ADMOB_IDS.interstitial }).then(function () {
      st.intLoading = false; st.intReady = true; tries.int = 0;
    }, function () { st.intLoading = false; st.intReady = false; retry('int', loadInt); });
  }
  function loadRew() {
    if (!st.started || st.rewReady || st.rewLoading) return;
    st.rewLoading = true;
    call('prepareRewardVideoAd', { adId: ADMOB_IDS.rewarded }).then(function () {
      st.rewLoading = false; st.rewReady = true; tries.rew = 0;
    }, function () { st.rewLoading = false; st.rewReady = false; retry('rew', loadRew); });
  }
  /* banner: ilk kez showBanner, sonra hideBanner / resumeBanner */
  function syncBanner() {
    if (!st.started) return;
    if (st.bWant && !st.bOn) {
      st.bOn = true;
      if (st.bMade) {
        call('resumeBanner').catch(function () { st.bMade = false; st.bOn = false; });
      } else {
        st.bMade = true;
        call('showBanner', { adId: ADMOB_IDS.banner, adSize: 'ADAPTIVE_BANNER', position: cfg.position, margin: 0 })
          .catch(function () { st.bMade = false; st.bOn = false; setSize(0); retry('ban', syncBanner); });

  /* tam ekran reklam bitti (kapandı / gösterilemedi) */
  function endFull() { var f = st.full; if (f) f.end(); }

  on('bannerAdSizeChanged', function (d) { setSize(st.bOn ? (+d.height || 0) : 0); });
  on('bannerAdFailedToLoad', function () {

  });
  on('interstitialAdDismissed', function () { if (st.full && st.full.kind === 'int') endFull(); });
  on('interstitialAdFailedToShow', function () { if (st.full && st.full.kind === 'int') endFull(); });
  on('onRewardedVideoAdReward', function () { if (st.full && st.full.kind === 'rew') st.full.earned = true; });
  on('onRewardedVideoAdDismissed', function () { if (st.full && st.full.kind === 'rew') endFull(); });
  on('onRewardedVideoAdFailedToShow', function () { if (st.full && st.full.kind === 'rew') endFull(); });
  /* yedek: reklam kapanma olayı hiç gelmezse, sayfa yeniden görününce 1.5 sn sonra oyuna dön */

        return call('requestConsentInfo').then(function (info) {

    ready: function () { return st.started && st.intReady && !st.full; },
    showRewarded: function (cb, failCb) {

        try { if (f.earned) cb(); else failCb(); } catch (e) {}
      };
      st.full = f;
      st.rewReady = false;
      /* ödül olayı (ya da çözülen ödül) gelirse kazanılır; oyun kapanınca devam eder */
      call('showRewardVideoAd').then(function (item) { f.earned = true; }, function () { f.end(); });
    },
    showInterstitial: function (cb) {

var Ads = {
  /* Android uygulamasında AdMob, tarayıcıda benzetici (AdSense H5 henüz yok) */
  provider: AdMobProvider || SimAdProvider,
  busy: false,

  updateProfile: function () {
    var o = P.counters.rewardedOffered, w = P.counters.rewardedWatched, p;
    if (P.noAds) p = 'D';
    else if (o < AD_PROFILE_MIN_OFFERS) p = 'B';
    else { var r = w / o; p = r >= 0.6 ? 'A' : r >= 0.2 ? 'B' : 'C'; }
    P.profile = p;
    return p;
  },

  /* teklif tuşu ekrana geldi */
  offered: function (placement) {
    P.counters.rewardedOffered++;
    Ads.updateProfile();
    save();
  },

  /* ödüllü reklam: izlenirse onReward(), olmazsa onFail() */
  rewarded: function (placement, onReward, onFail) {
    if (Ads.busy) return;
    Ads.busy = true;
    Celeb.stop();             /* kaybetme döngüsü reklamdan önce susar */
    Music.hold(true);
    function end() { Ads.busy = false; Music.hold(false); }
    Ads.provider.showRewarded(function () {
      end();
      P.counters.rewardedWatched++;
      Ads.updateProfile();
      save();
      onReward();
    }, function () {
      end();
      if (onFail) onFail(); else showAdFail(placement);
    });
  },

  /* bölüm kazanıldı (play kipi): sayaçlar */
  noteWin: function () {
    P.adLevelsSince++;
    if (P.adDeaths >= 2) P.adCalm = Math.max(P.adCalm, 2);
    else if (P.adDeaths >= 1) P.adCalm = Math.max(P.adCalm, 1);
    P.adDeaths = 0;
  },

  /* "Sonraki bölüm"e basıldı: kurallar uygunsa geçiş reklamı, sonra then() */
  interstitialAfterLevel: function (level, then) {
    var prof = Ads.updateProfile(), show = true;
    if (MODE === 'tut' || prof === 'D' || level < AD_MIN_LEVEL || Ads.busy) show = false;
    else if (P.adCalm > 0) { P.adCalm--; show = false; }
    else if (P.adLevelsSince < AD_GAP[prof]) show = false;
    else if (P.adLastAt && Date.now() - P.adLastAt < AD_MIN_MS) show = false;
    /* gerçek reklam yüklü değilse sayaçlara dokunmadan geç (oyunu bekletme) */
    if (show && Ads.provider.ready && !Ads.provider.ready()) show = false;
    if (!show) { save(); then(); return; }
    Ads.busy = true;
    Celeb.stop();
    Music.hold(true);
    P.adLastAt = Date.now();
    P.adLevelsSince = 0;
    P.counters.interstitialShown++;
    save();
    Ads.provider.showInterstitial(function () { Ads.busy = false; Music.hold(false); then(); });
  },

  /* kaybedince "baştan başla": her seferinde geçiş reklamı (yüklüyse), sonra bölüm yeniden başlar */
  interstitialAfterLoss: function (then) {

    if (show && Ads.provider.ready && !Ads.provider.ready()) show = false;
    if (!show) { then(); return; }
    Ads.busy = true;
    Celeb.stop();
    Music.hold(true);
    P.adLastAt = Date.now();
    P.counters.interstitialShown++;
    save();
    Ads.provider.showInterstitial(function () { Ads.busy = false; Music.hold(false); then(); });
  },

  banner: function () {

function preload(list, done) {
  var left = list.length;
  function one() { if (--left === 0) done(); }
  if (!left) { done(); return; }
  for (var i = 0; i < list.length; i++) {
    var img = new Image();
    img.onload = one; img.onerror = one;
    img.src = list[i];
  }
}

/* ---------- Ekrana sığdırma: --u (ölçü birimi), --uc (üst/alt blok birimi) + --bw (çerçeve genişliği) ---------- */
/* 1u = min(genişlik/390, yükseklik/844) px; küçük telefonlarda en az 1 (360 px'e kadar). Kartlar --u ile.
   Tablo tam ekran genişliğinde olmak ister; yükseklik yetmezse önce üst/alt blok küçülür (--uc, en az 0.72u),
   o da yetmezse tablo küçülür (.board-wrap CSS formülü). Yatayda yükseklik belirler. */
function fitLayout() {
  var root = document.documentElement, stage = $('stage');
  if (!stage) return;
  var w = window.innerWidth || root.clientWidth, h = window.innerHeight || root.clientHeight;
  var u = Math.max(Math.min(w / 390, h / 844), Math.min(1, w / 360));
  root.style.setProperty('--u', u.toFixed(4) + 'px');
  var wrap = stage.querySelector('.board-wrap'), play = stage.querySelector('.play');
  var n = parseFloat(stage.style.getPropertyValue('--n')) || 6;
  var k = 1.018 + 0.477 / n;                   /* tablo kutusu yüksekliği / genişliği (sekme dahil) */
  var ucMin = 0.72 * u, uc = u, i, bw, bdw;
  /* Android: alt bant uc ile ölçeklenmez (gerçek banner px), hesaptan ayrı tutulur */
  var band = IS_NATIVE ? $('adBand') : null, fixed = band ? band.offsetHeight : 0;
  /* üst/alt blok yüksekliği uc ile doğrusal: C = blok / uc; uc = (h − tablo) / C. Yazı kaydırmaları için 3 tur. */
  for (i = 0; i < 3; i++) {
    root.style.setProperty('--uc', uc.toFixed(4) + 'px');
    stage.style.setProperty('--bw', stage.clientWidth + 'px');
    if (!play) break;
    var full = stage.clientWidth;              /* kenarlar (güvenli alan hariç) */
    var chrome = stage.clientHeight - play.clientHeight + 92 * uc - fixed;
    var nu = Math.max(ucMin, Math.min(u, (h - fixed - full * k) / (chrome / uc)));
    if (Math.abs(nu - uc) < 0.002) break;
    uc = nu;
  }
  root.style.setProperty('--uc', uc.toFixed(4) + 'px');
  var inner = stage.clientWidth;
  var minBar = Math.min(inner, 352 * uc);     /* üst çubuğun sığdığı en dar genişlik (336 + iç boşluk) */
  bw = inner;
  /* kural şeridi daralınca uzayabilir -> tablo küçülür; birkaç turda oturur */
  for (i = 0; i < 4; i++) {
    stage.style.setProperty('--bw', bw.toFixed(2) + 'px');
    bdw = wrap ? wrap.getBoundingClientRect().width : inner;
    var nb = Math.max(minBar, Math.min(inner, bdw));
    if (Math.abs(nb - bw) < 0.5) break;
    bw = nb;
  }
  stage.style.setProperty('--bw', bw.toFixed(2) + 'px');
}
var fitTimer = 0;
function fitSoon() { clearTimeout(fitTimer); fitTimer = setTimeout(function () { fitLayout(); fitPlaque(); if (overlayOpen) fitCard(); }, 60); }
window.addEventListener('resize', fitSoon);
window.addEventListener('orientationchange', fitSoon);
document.addEventListener('fullscreenchange', fitSoon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLayout);
/* dile özel yazı tipi sonradan gelince yazılar yeniden sığdırılır */
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function () { fitSoon(); if (overlayOpen) fitCard(); });
fitLayout();

/* Tam ekran tuşu (dikey kalır) */
$('fs').addEventListener('click', function () {
  if (IS_NATIVE) return;   /* Android: tuş gizli, tam ekran isteği yok */
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var p = document.documentElement.requestFullscreen();
    if (p && p.then) p.then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {});
    }).catch(function () {});
  } catch (e) {}
});
</script>
