<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mappy</title>
<style>
:root{
  --u:max(min(100vw / 390, 100vh / 844), min(1px, 100vw / 360));
  --soft:#eef3fb;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--soft);font-family:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}

/* yumuşak zemin: aynı resmin bulanık, açık kopyası (geniş ekranda kenarları doldurur) */
.bg{position:fixed;inset:-6%;background:#eef3fb url(menu.webp) center/cover no-repeat;filter:blur(28px) saturate(1.1) brightness(1.08);opacity:0;transition:opacity .5s}
.bg.on{opacity:.85}
.bg::after{content:"";position:absolute;inset:0;background:rgba(240,245,255,.35)}

/* yükleme: soluk gri kopya + soldan sağa açılan renkli resim + ince çizgi */
.ghost{position:fixed;display:block;filter:grayscale(1) contrast(.8) brightness(1.15);opacity:0;transition:opacity .3s;pointer-events:none}
.ghost.on{opacity:.28}
.art{position:fixed;inset:0;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0)}
.art.done{clip-path:none;-webkit-clip-path:none}
.half{position:absolute;left:0;width:100%;overflow:hidden;display:block;outline:none;pointer-events:none;-webkit-tap-highlight-color:transparent}
.ready .half{pointer-events:auto}
.half img{position:absolute;display:block;max-width:none;transition:transform .14s ease-out,filter .14s}
.half.pressed img,.half:active img{transform:scale(.975);filter:brightness(1.08) saturate(1.05)}
.half:focus-visible::after{content:"";position:absolute;inset:calc(6*var(--u));border-radius:calc(18*var(--u));box-shadow:inset 0 0 0 calc(4*var(--u)) #fff,inset 0 0 0 calc(7*var(--u)) #5c35aa}

.bar{position:fixed;left:0;right:0;bottom:0;height:calc(5*var(--u));min-height:3px;background:rgba(92,53,170,.14);transition:opacity .4s}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a4fc8,#4fa3f0);transform-origin:left center;transform:scaleX(0)}
.ready .bar{opacity:0}

.ui-btn{position:fixed;z-index:3;border:0;padding:0;margin:0;background:none;border-radius:50%;line-height:0;opacity:0;pointer-events:none;transition:opacity .4s,transform .1s}
.ready .ui-btn{opacity:1;pointer-events:auto}
.ui-btn img{display:block;height:calc(48*var(--u));width:auto;filter:drop-shadow(0 calc(2*var(--u)) calc(4*var(--u)) rgba(30,20,60,.3))}
.ui-btn:active{transform:scale(.92)}
.ui-btn:focus-visible{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(2*var(--u))}
#fs{right:calc(12*var(--u) + env(safe-area-inset-right,0px));bottom:calc(14*var(--u) + env(safe-area-inset-bottom,0px))}
#mus{left:calc(12*var(--u) + env(safe-area-inset-left,0px));bottom:calc(14*var(--u) + env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion:reduce){
  .half img,.bg,.ghost,.ui-btn,.bar{transition:none}
}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<img class="ghost" id="ghost" alt="" aria-hidden="true">
<main class="art" id="art">
  <a class="half" id="hTop" href="puzzle.html" aria-label="Mappy Puzzle'ı oyna"><img alt=""></a>
  <a class="half" id="hBot" href="jump/index.html" aria-label="Mappy Jump'ı oyna"><img alt=""></a>
</main>
<div class="bar" aria-hidden="true"><i id="barFill"></i></div>
<button class="ui-btn" type="button" id="mus" aria-label="Müzik" aria-pressed="true"><img src="ik-muzik.webp" width="129" height="128" alt=""></button>
<button class="ui-btn" type="button" id="fs" aria-label="Tam ekran"><img src="ui-fullscreen.webp" width="129" height="128" alt=""></button>

<script>
/* =====================================================================
   MAPPY — açılış: yükleme ekranı (resim soldan sağa açılır) + ana menü (üst yarı Puzzle, alt yarı Jump)
   ===================================================================== */
function $(id) { return document.getElementById(id); }
var IMG_W = 941, IMG_H = 1672, SPLIT_Y = 867;     /* mavi/altın ayırıcı çubuk ~845–890 px, ortası 867 */
var MIN_LOAD_MS = 1200;
var SAFE_X = 22;                                   /* "Mappy Jump" logosu sağda x≈916'ya kadar uzanıyor */

/* ---------- ayar (launcher'a ait) ---------- */
var SAVE_KEY = 'mappyMenu.v1', S = { music: true };
try { var raw = localStorage.getItem(SAVE_KEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o.music === 'boolean') S.music = o.music; } } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- yerleşim: dik telefonda cover, geniş ekranda contain; hiç germe yok ---------- */
var rect = { x: 0, y: 0, w: IMG_W, h: IMG_H };
function layout() {
  var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
  var u = Math.max(Math.min(w / 390, h / 844), Math.min(1, w / 360));
  document.documentElement.style.setProperty('--u', u.toFixed(4) + 'px');
  /* dik ekranda cover, ama yanlardan en çok SAFE_X px kesilir (logolar ve tablo kenara çok yakın);
     kalan üst/alt şerit bulanık zeminle dolar. Geniş ekranda contain. */
  var cover = w / h <= 0.75;
  var sc = cover ? Math.min(Math.max(w / IMG_W, h / IMG_H), w / (IMG_W - 2 * SAFE_X)) : Math.min(w / IMG_W, h / IMG_H);
  rect.w = IMG_W * sc; rect.h = IMG_H * sc; rect.x = (w - rect.w) / 2; rect.y = (h - rect.h) / 2;
  var split = Math.round(rect.y + SPLIT_Y * sc);
  split = Math.max(1, Math.min(h - 1, split));
  place($('hTop'), 0, split, w);
  place($('hBot'), split, h - split, w);
  var g = $('ghost');
  g.style.left = rect.x + 'px'; g.style.top = rect.y + 'px'; g.style.width = rect.w + 'px'; g.style.height = rect.h + 'px';
}
function place(a, top, height, w) {
  a.style.top = top + 'px'; a.style.height = height + 'px';
  var im = a.querySelector('img');
  im.style.left = rect.x + 'px'; im.style.top = (rect.y - top) + 'px';
  im.style.width = rect.w + 'px'; im.style.height = rect.h + 'px';
  /* basma efekti o yarının ortasından küçülsün */
  im.style.transformOrigin = (w / 2 - rect.x) + 'px ' + (top + height / 2 - rect.y) + 'px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 80); });
document.addEventListener('fullscreenchange', function () { setTimeout(layout, 60); });
layout();

/* ---------- yüklenecekler: önce menü resmi, sonra iki oyunun ana dosyaları ---------- */
var ASSETS = (function () {
  var l = [], i;
  for (i = 0; i <= 8; i++) l.push('kare-' + i + '.webp', 'pati-' + i + '.webp');
  for (i = 0; i <= 9; i++) l.push('rakam-' + i + '.webp');
  l.push('fare-cikis.webp', 'fare-idle.webp', 'kalp-dolu.webp', 'kalp-bos.webp', 'rakam-bolu.webp', 'rakam-iki-nokta.webp',
         'ui-pause.webp', 'ui-ayar.webp', 'ui-fullscreen.webp', 'ui-baslik.webp', 'ui-kart.webp', 'ui-btn-altin.webp', 'ui-btn-mor.webp',
         'ui-para.webp', 'ui-rozet.webp', 'ui-arti.webp', 'ui-parilti.webp', 'ui-yildiz-dolu.webp', 'ui-yildiz-yarim.webp', 'ui-yildiz-bos.webp',
         'ik-ampul.webp', 'ik-buyutec.webp', 'ik-reklam.webp', 'ik-kupa.webp', 'ik-oynat.webp', 'ik-yeniden.webp', 'ik-ev.webp', 'ik-kapat.webp',
         'ik-muzik.webp', 'ik-muzik-kapali.webp', 'ik-ses.webp', 'ik-ses-kapali.webp', 'ik-titresim.webp', 'ik-titresim-kapali.webp',
         'jump/fare.webp', 'jump/ip.webp',
         'muzik.mp3', 'pop-1.mp3', 'ses-fare.mp3',
         'jump/baslangic.mp3', 'jump/ziplama-1.mp3', 'jump/ziplama-2.mp3', 'jump/ziplama-3.mp3');
  return l;
})();
var total = ASSETS.length + 1, done = 0, menuReady = false, t0 = Date.now(), shown = 0, finished = false;

function loadOne(src, cb) {
  var fin = false, to = setTimeout(end, 8000);       /* takılan dosya beklemesin */
  function end() { if (fin) return; fin = true; clearTimeout(to); cb(); }
  if (/\.mp3$/.test(src)) {
    try { if (window.fetch) { fetch(src).then(function (r) { return r.blob(); }).then(end, end); return; } } catch (e) {}
    end();
  } else {
    var im = new Image();
    im.onload = end; im.onerror = end;
    im.src = src;
  }
}
function loadAll() {
  var i = 0, running = 0, MAX = 6;
  function next() {
    while (running < MAX && i < ASSETS.length) {
      running++;
      loadOne(ASSETS[i++], function () { running--; done++; next(); });
    }
  }
  next();
}

/* menü resmi: hem iki yarı hem gri kopya için */
(function () {
  var im = new Image();
  im.onload = im.onerror = function () {
    var ok = im.naturalWidth > 0;
    var halves = document.querySelectorAll('.half img');
    for (var i = 0; i < halves.length; i++) halves[i].src = 'menu.webp';
    $('ghost').src = 'menu.webp';
    if (ok) { $('ghost').classList.add('on'); $('bg').classList.add('on'); }
    menuReady = true; done++;
    loadAll();
  };
  im.src = 'menu.webp';
})();

/* ilerleme: gerçek yükleme ve en az 1.2 sn; resim soldan sağa açılır */
function tick() {
  var real = done / total, timeP = Math.min(1, (Date.now() - t0) / MIN_LOAD_MS);
  var target = Math.min(real, timeP);
  shown += (target - shown) * 0.18;
  if (target >= 1 && shown > 0.995) shown = 1;
  $('barFill').style.transform = 'scaleX(' + shown.toFixed(4) + ')';
  var right = ((1 - (menuReady ? shown : 0)) * 100).toFixed(2) + '%';
  var cp = 'inset(0 ' + right + ' 0 0)';
  $('art').style.clipPath = cp; $('art').style.webkitClipPath = cp;
  if (shown >= 1) { finish(); return; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function finish() {
  if (finished) return;
  finished = true;
  $('art').style.clipPath = ''; $('art').style.webkitClipPath = '';
  $('art').classList.add('done');
  $('ghost').classList.remove('on');
  document.body.classList.add('ready');
}

/* ---------- oyuna geç: kısa basma efekti, sonra sayfa ---------- */
function bindHalf(a) {
  a.addEventListener('pointerdown', function () { a.classList.add('pressed'); });
  a.addEventListener('pointerup', function () { setTimeout(function () { a.classList.remove('pressed'); }, 160); });
  a.addEventListener('pointercancel', function () { a.classList.remove('pressed'); });
  a.addEventListener('pointerleave', function () { a.classList.remove('pressed'); });
  a.addEventListener('click', function (e) {
    if (!finished) { e.preventDefault(); return; }
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    a.classList.add('pressed');
    var href = a.getAttribute('href');
    setTimeout(function () { window.location.href = href; }, 140);
  });
}
bindHalf($('hTop')); bindHalf($('hBot'));
/* bfcache ile geri gelince basılı kalmasın */
window.addEventListener('pageshow', function () { $('hTop').classList.remove('pressed'); $('hBot').classList.remove('pressed'); Music.sync(); });

/* ---------- müzik: ilk dokunuştan sonra, ayara göre ---------- */
var Music = {
  el: null, unlocked: false,
  init: function () { try { this.el = new Audio('muzik.mp3'); this.el.loop = true; this.el.volume = 0.35; this.el.preload = 'auto'; } catch (e) { this.el = null; } },
  sync: function () {
    var a = this.el;
    if (!a) return;
    var want = S.music && this.unlocked && !document.hidden;
    if (want && a.paused) { try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    else if (!want && !a.paused) a.pause();
  }
};
Music.init();
(function () {
  var evs = ['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'];
  function unlock() { Music.unlocked = true; Music.sync(); }
  for (var i = 0; i < evs.length; i++) document.addEventListener(evs[i], unlock, true);
  document.addEventListener('visibilitychange', function () { Music.sync(); });
})();
function syncMusBtn() {
  var b = $('mus');
  b.setAttribute('aria-pressed', S.music ? 'true' : 'false');
  b.setAttribute('aria-label', S.music ? 'Müzik açık' : 'Müzik kapalı');
  b.querySelector('img').src = S.music ? 'ik-muzik.webp' : 'ik-muzik-kapali.webp';
}
$('mus').addEventListener('click', function () { S.music = !S.music; save(); syncMusBtn(); Music.unlocked = true; Music.sync(); });
syncMusBtn();

/* ---------- tam ekran (dikey kalır) ---------- */
$('fs').addEventListener('click', function () {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var p = document.documentElement.requestFullscreen();
    if (p && p.then) p.then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {});
    }).catch(function () {});
  } catch (e) {}
});
</script>
</body>
</html>
