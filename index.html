<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kedi Bulmaca Oyun Ekranı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Yerleşim: dikey telefon sahnesi. Üstte göstergeler, ortada kalın tepsi içinde
     resim kareler, altta iki resimli yardım tuşu. Sade açık zemin, tek güçlü şey tablo. */
  --page:linear-gradient(180deg,#faf6f8 0%,#f1e9f0 100%);
  --ink:#3a2a5e;
  --ink-dim:#6f6089;
  --font:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#faf6f8;background:var(--page) fixed;
  color:var(--ink);
  font-family:var(--font);
  line-height:1;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #5c35aa;outline-offset:3px}
button:disabled{cursor:default}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- Arka plan: düz, açık ---------- */
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--page)}

/* ---------- Sahne ---------- */
.stage{
  position:relative;z-index:1;
  height:100%;min-height:560px;max-width:460px;margin:0 auto;
  padding:14px 16px 20px;
  display:flex;flex-direction:column;gap:14px;
  container-type:size;
}

/* ---------- Rakam resimleri (digitsHTML) ---------- */
.dg{display:inline-flex;align-items:center;line-height:0;white-space:nowrap}
.dg img{display:block;width:auto;flex:none}

/* ---------- Üst sıra ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.top-left{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ui-btn{
  border:0;padding:0;margin:0;background:none;line-height:0;border-radius:50%;
  transition:transform .1s,opacity .2s;
}
.ui-btn img{display:block;height:50px;width:auto}
.ui-btn:active:not(:disabled){transform:scale(.92)}
.ui-btn:disabled{opacity:.55}
.level{display:flex;flex-direction:column;align-items:center;gap:2px}
.plaque{
  position:relative;width:200px;width:min(200px,44vw);aspect-ratio:557/181;
  background:url(ui-baslik.webp) center/100% 100% no-repeat;
}
/* krem iç alan: plakanın ortası */
.level-line{
  position:absolute;left:0;right:0;top:6%;bottom:10%;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.level-k{
  font-size:14px;font-weight:800;letter-spacing:.12em;color:#8a4b3c;padding-top:3px;
}
.level-n img{height:30px}
.stars{display:flex;gap:3px;line-height:0}
.stars img{display:block;height:26px;width:auto}
/* sayı paneli (ui-sayac): mor hap, altın kenar */
.panel{
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:url(ui-sayac.webp) center/100% 100% no-repeat;
}
.coins{height:40px;min-width:96px;padding:0 14px 0 9px}
.coins .ico{height:26px;width:auto;display:block;flex:none}
.coins .dg img{height:18px}

/* ---------- Gösterge sırası: can çubuğu + süre + sayaç ---------- */
.stats{display:flex;align-items:center;gap:8px}
.lives{flex:none;height:50px;padding:0 12px;display:flex;align-items:center;gap:3px;transition:filter .4s,opacity .4s}
.lives img{height:28px;height:clamp(22px,7cqw,30px);width:auto;display:block}
.lives.out{filter:grayscale(1);opacity:.55}
.plate{flex:1;min-width:0;height:50px;padding:0 6px}
.plate .ico{height:24px;height:clamp(20px,6cqw,26px);width:auto;display:block;flex:none}
.plate .dg img{height:22px;height:clamp(16px,5.4cqw,26px)}

/* ---------- Tablo ---------- */
.board-wrap{
  align-self:center;margin:auto 0;
  width:min(92vw,50vh,428px);
  width:max(220px,min(100cqw,100cqh - 340px));
  container-type:inline-size;
}
.tray{
  font-size:3.4px;font-size:1cqw;           /* 1em = tablo genişliğinin %1'i */
  position:relative;
  padding:2.6em;border-radius:9em;
  /* farenin halkasıyla aynı: açık lila-gri, yumuşak parlak */
  background:linear-gradient(165deg,#f1eef9 0%,#dedaef 25%,#c9c5da 60%,#b5b0c8 85%,#d4d0e3 100%);
  box-shadow:
    inset 0 .5em .3em rgba(255,255,255,.9),
    inset 0 -.6em .9em rgba(90,80,120,.3),
    0 1.4em 0 #a39db8,
    0 4.5em 6em rgba(80,70,110,.25);
}
/* iç zemin: farenin deliğindeki koyu mor-kahve */
.well{
  position:relative;z-index:1;border-radius:6.6em;
  padding:2em;
  background:
    radial-gradient(90% 70% at 50% 40%, #33283a 0%, #251d27 70%, #1c161e 100%);
  box-shadow:
    inset 0 1.4em 2em rgba(0,0,0,.6),
    inset 0 -.3em .4em rgba(255,255,255,.08);
}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}

/* hücre = gerçek tuş; içinde bölge rengindeki resim kare */
.cell{
  position:relative;display:block;width:100%;aspect-ratio:1;
  margin:0;padding:0;border:0;background:none;border-radius:22%;
}
.cell:focus-visible{outline:.7em solid #fff4c2;outline-offset:-.5em}
.cell.lift{z-index:3}
.tile{
  position:absolute;left:3%;top:3%;width:94%;height:94%;display:block;
  pointer-events:none;transition:filter .5s ease;
}
.tile.bad{filter:grayscale(1);transition:none}
.tile.pop{animation:pop .22s ease-out}
.tile.shake{animation:shake .35s linear}
@keyframes pop{0%{transform:scale(.84)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7%)}40%{transform:translateX(6%)}60%{transform:translateX(-4%)}80%{transform:translateX(2%)}}

/* ipucu ile işaretlenen kare: kısa sarı parıltı */
.cell.glow::after{
  content:"";position:absolute;inset:1%;border-radius:24%;pointer-events:none;
  border:.5em solid #fff4c2;
  box-shadow:0 0 2.2em .5em rgba(255,206,90,.95), inset 0 0 1.4em rgba(255,236,170,.85);
  animation:glow .6s ease-in-out 2 both;
}
@keyframes glow{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

/* fare: halka çapı = kare genişliği; sprite kutusu karenin %148'i, ortalı */
.pet{
  position:absolute;left:50%;top:50%;width:82.5%;aspect-ratio:1;
  transform:translate(-50%,calc(-50% - 2px));pointer-events:none;   /* halka merkezi, 2 px yukarı */
  background-repeat:no-repeat;
  filter:drop-shadow(0 .5em .6em rgba(0,0,0,.45));
}

/* ---------- Alt tuşlar: ampul (ipucu) + büyüteç ---------- */
.tools{display:flex;justify-content:center;align-items:flex-end;gap:28px;padding-bottom:6px}
.img-btn{
  position:relative;border:0;padding:0;margin:0;background:none;line-height:0;border-radius:50%;
  transition:transform .1s,opacity .2s,filter .2s;
}
.img-btn > img{display:block;width:76px;height:76px}
.img-btn:active:not(:disabled){transform:translateY(2px) scale(.97)}
.img-btn:disabled{opacity:.55;filter:grayscale(.35)}
.img-btn > .badge{
  position:absolute;top:-4px;right:-4px;left:auto;bottom:auto;
  width:28px;height:28px;min-width:0;max-width:none;padding:0;margin:0;
  display:flex;align-items:center;justify-content:center;line-height:0;overflow:visible;
  background:url(ui-rozet.webp) center/100% 100% no-repeat;
}
.img-btn > .badge .dg{display:inline-flex;height:18px}
.img-btn > .badge .dg img{display:block;width:auto;height:18px;max-width:none}
.img-btn > .badge.plus{background:none}
.img-btn > .badge.plus img{display:block;width:28px;height:28px}

/* ---------- Kaplama kartları (kazandın / can bitti / reklam / duraklat) ---------- */
.overlay{
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
  background:rgba(58,42,94,.38);
}
.overlay[hidden]{display:none}
.card{
  --cw:min(88vw,360px);
  position:relative;width:var(--cw);aspect-ratio:645/375;
  /* içerik krem alanda */
  padding:calc(var(--cw) * .1) 9% calc(var(--cw) * .08);
  text-align:center;color:var(--ink);
  background:url(ui-kart.webp) center/100% 100% no-repeat;
  animation:cardIn .22s ease-out;
}
@keyframes cardIn{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 8px;font-size:28px;font-size:clamp(22px,7.4vw,28px);white-space:nowrap;font-weight:800;line-height:1.1;color:#3a1d7a}
.card p{margin:0 0 12px;font-size:18px;font-weight:600;line-height:1.3;color:var(--ink)}
.card p b{color:#3a1d7a;font-weight:800}
.card .acts{display:flex;flex-direction:column;align-items:center;gap:10px}
/* yan yana iki tuş: solda Tekrar oyna, sağda Sonraki bölüm */
.card .acts.pair{flex-direction:row;justify-content:center;gap:8px}
.card .acts.pair button{flex:1 1 0;min-width:0;max-width:150px;height:50px;padding:3px 8px 0;font-size:16px;font-size:clamp(14px,4.3vw,17px);white-space:nowrap}
.ad-btn{border:0;padding:4px;margin:0;background:none;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ad-btn img{display:block;width:72px;height:72px;border-radius:50%;transition:transform .1s}
.ad-btn .cap{font-size:18px;font-weight:800;line-height:1.15;color:var(--ink);max-width:11em}
.ad-btn:active img{transform:scale(.94)}
/* yuvarlak simge tuşları (duraklat / ayarlar / can bitti kartı) */
.icon-row{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:10px 16px}
.ic-btn{border:0;padding:4px;margin:0;background:none;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}
.ic-btn img{display:block;width:60px;height:60px;border-radius:50%;transition:transform .1s}
.ic-btn .cap{font-size:15px;font-weight:800;line-height:1.1;color:var(--ink)}
.ic-btn:active img{transform:scale(.92)}
.ic-btn.close-x img{width:52px;height:52px}
.card .close-row{display:flex;justify-content:center;margin-top:10px}
/* duraklat / ayarlar: dikey satır listesi (simge solda, yazı sağda) */
.card.menu{
  aspect-ratio:auto;min-height:calc(var(--cw) * 375 / 645);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(var(--cw) * .12) 9% calc(var(--cw) * .11);
}
.card.menu h2{margin:0 0 2px}
.row-list{display:flex;flex-direction:column;align-items:stretch;gap:14px;width:200px;max-width:100%}
.row-btn{
  display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
  border:0;padding:0;margin:0;background:none;border-radius:28px;text-align:left;
}
.row-btn img{display:block;flex:none;width:56px;height:56px;border-radius:50%;transition:transform .1s}
.row-btn .cap{flex:1;min-width:0;font-size:20px;font-weight:800;line-height:1.1;color:var(--ink)}
.row-btn .st{flex:none;font-size:14px;font-weight:700;line-height:1;color:var(--ink-dim)}
.row-btn:active img{transform:scale(.92)}
/* kazandın kartı: kupa */
.win-cup{display:block;height:54px;width:auto;margin:0 auto 4px}
/* yerleşik reklam kartı (SDK yokken) */
.ad-bar{width:80%;height:12px;margin:10px auto 2px;border-radius:6px;background:#e6d9f3;overflow:hidden}
.ad-bar i{display:block;width:100%;height:100%;border-radius:6px;background:#7a4fc8;transform-origin:left center;animation:adBar 2s linear both}
@keyframes adBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.card:focus{outline:none}
.main-btn,.txt-btn{
  min-width:170px;height:52px;border:0;border-radius:26px;padding:3px 26px 0;
  font-size:20px;font-weight:800;
  background:center/100% 100% no-repeat;
  transition:transform .1s;
}
.main-btn{color:#4a2500;background-image:url(ui-btn-altin.webp)}
.txt-btn{color:#3a1d7a;font-size:19px;background-image:url(ui-btn-mor.webp)}
.main-btn:active,.txt-btn:active{transform:scale(.95)}
/* kazandın kartı: parıltılar */
.sparkle{position:absolute;width:auto;pointer-events:none;animation:twinkle 1.6s ease-in-out infinite}
.sparkle.s1{height:34px;top:17%;left:9%}
.sparkle.s2{height:26px;top:23%;right:10%;animation-delay:.55s}
.sparkle.s3{height:20px;top:44%;left:13%;animation-delay:1.1s}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.55}50%{transform:scale(1.1) rotate(15deg);opacity:1}}

/* ---------- Zor bölüm etiketi ---------- */
.boss{
  position:absolute;left:50%;top:-7px;transform:translateX(-50%);z-index:2;
  padding:3px 9px 1px;border-radius:9px;white-space:nowrap;
  font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;
  background:linear-gradient(180deg,#f0566a,#b8213a);
  box-shadow:0 2px 0 #6e1022,0 0 0 2px #ffd36b;
}
.boss[hidden]{display:none}

/* ---------- Öğretici: yazı kutusu + parmak ---------- */
.board-wrap{position:relative}
.is-tut .stats,.is-tut .tools{visibility:hidden}
.tut-box{
  position:absolute;left:3%;right:3%;bottom:calc(100% + 10px);z-index:5;
  padding:12px 16px 10px;border-radius:18px;background:#fff;
  box-shadow:0 4px 0 #d9cde6,0 10px 24px rgba(58,42,94,.22);
  text-align:center;animation:cardIn .22s ease-out;
}
.tut-box[hidden]{display:none}
.tut-box p{margin:0;font-size:17px;font-weight:700;line-height:1.25;color:var(--ink)}
.tut-skip{
  position:absolute;top:-12px;right:-6px;height:30px;padding:2px 14px 0;border:0;border-radius:15px;
  font-size:15px;font-weight:800;color:#fff;background:#6a43b8;box-shadow:0 2px 0 #3a1d7a;
}
.tut-skip[hidden]{display:none}
.tut-hand{
  position:absolute;z-index:6;pointer-events:none;
  width:calc(100% / var(--n) * .42);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff 0 55%,#efe8f7 100%);
  border:.7em solid rgba(106,67,184,.9);
  box-shadow:0 1em 1.6em rgba(0,0,0,.45);
  transform:translate(-50%,-50%);
  animation:handBob .9s ease-in-out infinite;
}
.tut-hand[hidden]{display:none}
@keyframes handBob{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-85%) scale(.92)}}

/* ---------- Kazandın kartı: yıldız, süre, para ---------- */
.win-stars{display:flex;justify-content:center;gap:4px;margin:0 0 8px;line-height:0}
.win-stars img{display:block;height:40px;width:auto}
.card p.win-info{display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
.win-coins{display:inline-flex;align-items:center;gap:4px}
.win-coins img{height:24px;width:auto;display:block}

@media (prefers-reduced-motion:reduce){
  .tile.pop,.tile.shake,.card,.sparkle,.tut-box{animation:none}
  .tut-hand{animation:none}
  .cell.glow::after{animation:none;opacity:1}
  .img-btn,.ui-btn,.main-btn,.txt-btn,.ad-btn img,.ic-btn img,.row-btn img{transition:none}
  .ad-bar i{animation:none}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<main class="stage" id="stage">

  <header class="top">
    <div class="top-left">
      <button class="ui-btn" type="button" id="back" aria-label="Bölümü baştan başla">
        <img src="ik-yeniden.webp" width="129" height="128" alt="">
      </button>
      <button class="ui-btn" type="button" id="pause" aria-label="Duraklat">
        <img src="ui-pause.webp" width="129" height="128" alt="">
      </button>
      <button class="ui-btn" type="button" id="settings" aria-label="Ayarlar">
        <img src="ui-ayar.webp" width="129" height="128" alt="">
      </button>
    </div>

    <div class="level">
      <div class="plaque">
        <span class="boss" id="boss" hidden>ZOR BÖLÜM</span>
        <div class="level-line"><span class="level-k" id="levelK">BÖLÜM</span><span class="level-n" id="levelNo"></span></div>
      </div>
      <div class="stars" id="stars" role="img" aria-label="3 yıldızdan 0"></div>
    </div>

    <div class="top-right">
      <div class="coins panel" id="coins" role="img" aria-label="0 mama parası">
        <img class="ico" src="ui-para.webp" width="97" height="96" alt="">
        <span id="coinNum"></span>
      </div>
      <button class="ui-btn" type="button" id="fs" aria-label="Tam ekran">
        <img src="ui-fullscreen.webp" width="125" height="128" alt="">
      </button>
    </div>
  </header>

  <section class="stats" aria-label="Göstergeler">
    <div class="lives panel" id="lives" role="img" aria-label="Kalan can: 3 / 3">
      <img src="kalp-dolu.webp" width="113" height="96" alt="">
      <img src="kalp-dolu.webp" width="113" height="96" alt="">
      <img src="kalp-dolu.webp" width="113" height="96" alt="">
    </div>
    <div class="plate panel">
      <img class="ico" src="ui-saat.webp" width="79" height="96" alt="">
      <span id="time"></span>
    </div>
    <div class="plate panel">
      <img class="ico" src="ui-pati.webp" width="109" height="96" alt="">
      <span id="count"></span>
    </div>
  </section>

  <section class="board-wrap">
    <div class="tray">
      <div class="well">
        <div class="grid" id="grid" role="group" aria-label="bulmaca tablosu"></div>
      </div>
    </div>
    <div class="tut-box" id="tutBox" role="status" aria-live="polite" hidden>
      <p id="tutText"></p>
      <button class="tut-skip" type="button" id="tutSkip" data-act="tutSkip" hidden>Geç</button>
    </div>
  </section>

  <footer class="tools">
    <button class="img-btn" type="button" id="btnHint" aria-label="İpucu: fare olamayacak kareleri işaretle">
      <img src="ik-ampul.webp" width="159" height="160" alt="">
      <span class="badge" id="badgeHint" aria-hidden="true"></span>
    </button>
    <button class="img-btn" type="button" id="btnGlass" aria-label="Büyüteç: bir fareyi göster">
      <img src="ik-buyutec.webp" width="161" height="160" alt="">
      <span class="badge" id="badgeGlass" aria-hidden="true"></span>
    </button>
  </footer>

</main>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ovTitle"></div>
</div>

<script>
/* =====================================================================
   FARE BULMACA — bölümler: A rng, B sayan çözücü, C zorluk ölçer, D üretici,
   E ilerleme (hedef, ZP), F kayıt, G sabitler, H oyun durumu, I yardımcılar,
   K çizim, L giriş, M yardımlar, N öğretici, O kartlar, P başlat.
   Saf mantık @@PURE-BEGIN/END arasında (tools/gen_test.js node'da çıkarıp test eder).
   ===================================================================== */
/* @@PURE-BEGIN */
/* =====================================================================
   A. RNG (tohumlu, tekrar üretilebilir)
   ===================================================================== */
var MAX_N = 8;
/* kullanılabilir kare renkleri (kare-N / pati-N), pastel set: 9 renk (8 = kahve) */
var TILE_COLORS = [0, 1, 2, 3, 4, 5, 7, 6, 8];

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* sayıları tek bir 32 bit tohuma karıştırır (FNV-1a + son karıştırma) */
function hashSeed() {
  var h = 2166136261 >>> 0, i, k, x;
  for (i = 0; i < arguments.length; i++) {
    x = arguments[i] >>> 0;
    for (k = 0; k < 4; k++) { h ^= x & 255; h = Math.imul(h, 16777619) >>> 0; x >>>= 8; }
  }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}
function randInt(rng, n) { return Math.floor(rng() * n); }
function shuffle(rng, a) {
  for (var i = a.length - 1; i > 0; i--) { var j = randInt(rng, i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  tiles: [0,2,1,4]
};

var START_LIVES = 3;
var HINT_MARKS = 5;      /* bir ampul en çok kaç kareyi işaretler */
var AD_HELP_REWARD = 2;  /* reklamla gelen yardım hakkı */

/* Fare animasyonları (8x2 sprite) */
var SPRITES = {
  emerge: { src: 'fare-cikis.webp', cols: 8, rows: 2, frames: 12,
            durations: [170,170,170,170,170,170,170,170,170,170,170,170] },
  idle:   { src: 'fare-idle.webp',  cols: 8, rows: 2, frames: 12,
            durations: [170,170,170,170,170,170,170,170,170,170,170,170] }
};
/* false: açılan fare bir kez çıkar, sonra sonsuza dek idle */
var DEMO_LOOP = false;

var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* =====================================================================
   H. OYUN DURUMU
   ===================================================================== */
var P = loadSave();
var LEVEL = null;        /* { L, size, regions[r][c], solution, tiles, score, boss } */
var PUZ = null;          /* LEVEL'in düz (kayıtlı) hali */
var MODE = 'play';       /* 'play' | 'replay' | 'tut' */
var S = null;
var view = { cells: [] };          /* view.cells[r][c] = { btn, img, pet, busy, glowT } */
var overlayOpen = false, overlayDismiss = false;
var fxTimers = [];
var pre = null;                    /* arka planda üretilen sonraki bölüm (GenJob) */

function toLevel(pz) {
  var n = pz.n, regions = [], r, c;
  for (r = 0; r < n; r++) { regions.push([]); for (c = 0; c < n; c++) regions[r].push(pz.regions[r * n + c]); }
  var score = typeof pz.score === 'number' ? pz.score : rate(n, pz.regions).score;
  return { L: pz.L || 0, size: n, regions: regions, solution: pz.solution.slice(), tiles: pz.tiles,
           score: score, boss: !!pz.boss };
}

function newState() {
  var n = LEVEL.size, cells = [], r, c;
  for (r = 0; r < n; r++) { cells.push([]); for (c = 0; c < n; c++) cells[r].push('closed'); }
  return {
    cells: cells, found: 0, lives: START_LIVES,
    status: 'play',                  /* 'play' | 'won' | 'over' */
    ms: 0, since: 0,                 /* süre: biriken ms + çalışıyorsa başlangıç anı */
    mistakes: 0, bulbs: 0, glasses: 0
  };
}

/* =====================================================================
   I. YARDIMCILAR
   ===================================================================== */
/* hücre durumları: 'closed' (düz kare), 'paw' (oyuncunun "burada yok" işareti), 'mouse' (açıldı) */
function $(id) { return document.getElementById(id); }
function regionOf(r, c) { return LEVEL.regions[r][c]; }
function isMouse(r, c) { return LEVEL.solution[r] === c; }
function tileSrc(r, c, kind) { return kind + '-' + LEVEL.tiles[regionOf(r, c)] + '.webp'; }
function canPlay() { return S && S.status === 'play' && !overlayOpen && !(tut && tut.busy); }
function fx(fn, ms) { var t = setTimeout(fn, ms); fxTimers.push(t); return t; }
function clearFx() { for (var i = 0; i < fxTimers.length; i++) clearTimeout(fxTimers[i]); fxTimers = []; }
function restartClass(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function fmtCoins(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

/* ---------- resim rakamlar ---------- */
var DIGIT_W = { '0':53, '1':44, '2':41, '3':48, '4':53, '5':49, '6':50, '7':49, '8':49, '9':48, '/':44, ':':35 };
var DIGIT_FILE = { '/':'bolu', ':':'iki-nokta' };
/* "0-9 / :" dizisini rakam resimlerine çevirir (64 px yüksek kaynaklar); diğer karakterler atlanır */
function digitsHTML(str, h, label) {
  str = String(str);
  var out = '', i, ch;
  for (i = 0; i < str.length; i++) {
    ch = str.charAt(i);
    if (!DIGIT_W.hasOwnProperty(ch)) continue;
    out += '<img src="rakam-' + (DIGIT_FILE[ch] || ch) + '.webp" width="' + Math.round(DIGIT_W[ch] * h / 64) +
           '" height="' + h + '" alt="" aria-hidden="true">';
  }
  return '<span class="dg" role="img" aria-label="' + (label || str) + '">' + out + '</span>';
}
function setDigits(el, str, h, label) {
  var key = str + '|' + (label || '');
  if (el.getAttribute('data-v') === key) return;
  el.setAttribute('data-v', key);
  el.innerHTML = digitsHTML(str, h, label);
}
function starsHTML(n) {
  var html = '', i;
  for (i = 1; i <= 3; i++) {
    var f = n >= i ? 'dolu' : (n >= i - 0.5 ? 'yarim' : 'bos');
    html += '<img src="ui-yildiz-' + f + '.webp" width="100" height="96" alt="">';
  }
  return html;
}
/* plaka, yıldızlar, mama parası */
function renderStatic() {
  var isTut = MODE === 'tut';
  $('stage').classList.toggle('is-tut', isTut);
  $('levelK').textContent = isTut ? 'ÖĞRETİCİ' : 'BÖLÜM';
  if (isTut) { $('levelNo').innerHTML = ''; $('levelNo').removeAttribute('data-v'); }
  else setDigits($('levelNo'), String(LEVEL.L), 30, 'Bölüm ' + LEVEL.L);
  $('boss').hidden = isTut || !LEVEL.boss;
  setDigits($('coinNum'), String(P.coins), 18);
  $('coins').setAttribute('aria-label', fmtCoins(P.coins) + ' mama parası');
  $('stars').innerHTML = starsHTML(P.lastStars);
  $('stars').setAttribute('aria-label', '3 yıldızdan ' + P.lastStars);
}

/* ---------- süre ---------- */
function elapsed() { return S.ms + (S.since ? Date.now() - S.since : 0); }
function fmtTime(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  s = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
/* oyun sürüyorsa ve kart açık değilse saat işler */
function syncClock() {
  if (S.since) { S.ms += Date.now() - S.since; S.since = 0; }
  if (S.status === 'play' && !overlayOpen) S.since = Date.now();
  renderTime();
}
function renderTime() {
  var t = fmtTime(elapsed());
  setDigits($('time'), t, 26, 'Süre ' + t);
}

/* =====================================================================
   J. İLERLEME: bölüm başlatma, önceden üretme, bölüm sonu
   ===================================================================== */
function puzzleFor(L) {
  var pz = null;
  if (pre && pre.fits(L, P.zp)) pz = pre.run();          /* hazırsa anında, değilse bitirir */
  if (!pz) { try { pz = new GenJob(P.profileSeed, L, P.zp).run(); } catch (e) { pz = null; } }
  if (!pz) {                                                /* yedek */
    pz = { n: FALLBACK_LEVEL.n, regions: FALLBACK_LEVEL.regions.slice(), solution: FALLBACK_LEVEL.solution.slice(),
           tiles: FALLBACK_LEVEL.tiles.slice(), L: L, boss: false };
    pz.score = rate(pz.n, pz.regions).score;
  }
  pz.L = L;
  pre = null;
  return pz;
}

/* sonraki bölümü küçük parçalarla arka planda üretir */
function pregen(L) {
  if (pre && pre.fits(L, P.zp)) return;
  var job = pre = new GenJob(P.profileSeed, L, P.zp);
  function tick() {
    if (pre !== job || job.done) return;
    if (!job.step()) setTimeout(tick, 16);
  }
  setTimeout(tick, 600);
}

function startGameLevel(L) {
  var pz = (P.cur && P.cur.L === L && P.cur.regions && P.cur.regions.length === P.cur.n * P.cur.n) ? P.cur : puzzleFor(L);
  P.cur = pz;
  save();
  begin(pz, 'play');
  pregen(L + 1);
}

/* aynı bulmacayı (yeniden) başlatır */
function begin(pz, mode) {
  endTutorialUI();
  PUZ = pz;
  MODE = mode;
  LEVEL = toLevel(pz);
  if (mode === 'play') bump('levelsPlayed');
  resetLevel();
}

function resetLevel() {
  clearFx();
  clearPetTimers();
  spritesWaiting = [];
  if (overlayOpen) closeOverlay();
  S = newState();
  renderStatic();
  buildBoard();
  syncClock();
  updateHud();
}

function onLevelWon() {
  S.status = 'won';
  syncClock();
  if (MODE === 'tut') { fx(showTutWin, REDUCED ? 400 : 1500); updateHud(); return; }
  var stars = starsFor(S.mistakes, S.glasses), coins = 0;
  if (MODE === 'play') {
    coins = coinsFor(stars, LEVEL.boss);
    P.zp = zpAfterLevel(P.zp, LEVEL.size, LEVEL.score, elapsed(), S.mistakes, S.bulbs, S.glasses);
    P.coins += coins;
    P.level = LEVEL.L + 1;
    P.cur = null;
    P.consecutiveGameOvers = 0;
    P.counters.levelsWon++;
    Ads.noteWin();
  }
  P.lastStars = stars;
  save();
  pregen(P.level);                  /* ZP değişti: gerekirse yeniden üretir */
  updateHud();
  fx(function () { renderStatic(); showWin(stars, coins); }, REDUCED ? 400 : 1500);
}

function onGameOver() {
  S.status = 'over';
  syncClock();
  P.counters.deaths++;
  P.adDeaths++;
  P.consecutiveGameOvers++;
  if (P.consecutiveGameOvers >= 2) { P.zp = clamp(P.zp - 10, 0, 100); P.consecutiveGameOvers = 0; }
  save();
  fx(showGameOver, 800);
}

/* =====================================================================
   K. ÇİZİM
   ===================================================================== */
var CELL_LABEL = { closed: 'kapalı', paw: 'pati işareti', mouse: 'fare' };

function buildBoard() {
  var n = LEVEL.size, grid = $('grid'), r, c;
  grid.style.setProperty('--n', n);
  grid.setAttribute('aria-label', n + "'ye " + n + ' bulmaca tablosu');
  grid.textContent = '';
  view.cells = [];
  for (r = 0; r < n; r++) {
    var row = [];
    for (c = 0; c < n; c++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      btn.setAttribute('data-r', r);
      btn.setAttribute('data-c', c);
      var img = document.createElement('img');
      img.className = 'tile';
      img.alt = '';
      img.draggable = false;
      btn.appendChild(img);
      grid.appendChild(btn);
      row.push({ btn: btn, img: img, pet: null, busy: false, glowT: 0 });
    }
    view.cells.push(row);
  }
  var hand = document.createElement('div');
  hand.className = 'tut-hand';
  hand.id = 'tutHand';
  hand.hidden = true;
  hand.setAttribute('aria-hidden', 'true');
  grid.appendChild(hand);
  for (r = 0; r < n; r++) for (c = 0; c < n; c++) paintCell(r, c);
}

function paintCell(r, c) {
  var st = S.cells[r][c], v = view.cells[r][c];
    if (st !== 'mouse') {
    var src = tileSrc(r, c, st === 'paw' ? 'pati' : 'kare');
    if (v.img.getAttribute('src') !== src) v.img.setAttribute('src', src);
  } else if (!v.pet) {
    /* fare açılınca altındaki kare çatlak (pati) kareye döner; halka patiyi örter, çatlaklar görünür */
    var psrc = tileSrc(r, c, 'pati');
    if (v.img.getAttribute('src') !== psrc) v.img.setAttribute('src', psrc);
    v.btn.classList.add('lift');
    v.pet = document.createElement('div');
    v.pet.className = 'pet';
    v.pet.setAttribute('aria-hidden', 'true');
    v.btn.appendChild(v.pet);
    startPet(v.pet);
  }
  v.btn.setAttribute('aria-label', 'Satır ' + (r + 1) + ', sütun ' + (c + 1) + ': ' + CELL_LABEL[st]);
}

function updateHud() {
  var n = LEVEL.size, play = canPlay() && MODE !== 'tut';
  var lives = $('lives');
  var hearts = lives.getElementsByTagName('img'), hi;
  for (hi = 0; hi < hearts.length; hi++) {
    var hsrc = hi < S.lives ? 'kalp-dolu.webp' : 'kalp-bos.webp';
    if (hearts[hi].getAttribute('src') !== hsrc) {
      hearts[hi].setAttribute('src', hsrc);
      hearts[hi].setAttribute('width', hi < S.lives ? 113 : 107);
    }
  }
  lives.classList.toggle('out', S.lives <= 0);
  lives.setAttribute('aria-label', 'Kalan can: ' + Math.max(0, S.lives) + ' / ' + START_LIVES);

  setDigits($('count'), S.found + '/' + n, 26, 'Bulunan fare: ' + S.found + ' / ' + n);

  setHelpButton('btnHint', 'badgeHint', P.bulb, 'İpucu: fare olamayacak kareleri işaretle', play);
  setHelpButton('btnGlass', 'badgeGlass', P.glass, 'Büyüteç: bir fareyi göster', play);
  $('pause').disabled = !(S.status === 'play' && !overlayOpen);
  $('settings').disabled = overlayOpen;
  $('back').disabled = !S || overlayOpen;
}

function setHelpButton(btnId, badgeId, count, label, enabled) {
  var btn = $(btnId), badge = $(badgeId);
  btn.disabled = !enabled;
  if (count > 0) setDigits(badge, String(count), 22);
  else if (!badge.classList.contains('plus')) {
    badge.setAttribute('data-v', '+');
    badge.innerHTML = '<img src="ui-arti.webp" width="63" height="64" alt="">';
  }
  badge.classList.toggle('plus', count <= 0);
  btn.setAttribute('aria-label', label + (count > 0 ? ', ' + count + ' hak' : ', hak bitti, reklamla al'));
}

/* ---------- fare sprite oynatıcı ---------- */
var petTimers = [];
var spritesReady = false, spritesWaiting = [];

function petLater(fn, ms) {
  var t = setTimeout(function () {
    var i = petTimers.indexOf(t);
    if (i >= 0) petTimers.splice(i, 1);
    fn();
  }, ms);
  petTimers.push(t);
  return t;
}
function clearPetTimers() { for (var i = 0; i < petTimers.length; i++) clearTimeout(petTimers[i]); petTimers = []; }

function setPetFrame(el, sp, f) {
  var col = f % sp.cols, row = Math.floor(f / sp.cols);
  var x = sp.cols > 1 ? col / (sp.cols - 1) * 100 : 0;
  var y = sp.rows > 1 ? row / (sp.rows - 1) * 100 : 0;
  el.style.backgroundImage = 'url(' + sp.src + ')';
  el.style.backgroundSize = (sp.cols * 100) + '% ' + (sp.rows * 100) + '%';
  el.style.backgroundPosition = x + '% ' + y + '%';
}

/* Bir sprite'ı oynatır; loops kez döner (Infinity = sonsuz), bitince onDone */
function playSprite(el, sp, loops, onDone) {
  var f = 0, done = 0;
  function step() {
    if (!el.isConnected) return;
    setPetFrame(el, sp, f);
    var d = sp.durations[f] || 100;
    if (d < 20) d = 100;
    petLater(function () {
      f++;
      if (f >= sp.frames) { f = 0; done++; if (done >= loops) { if (onDone) onDone(); return; } }
      step();
    }, d);
  }
  step();
}

/* çıkış bir kez, sonra idle (idleLoops yoksa sonsuz) */
function playPet(el, onDone, idleLoops) {
  if (REDUCED) { setPetFrame(el, SPRITES.idle, 0); if (onDone) onDone(); return; }
  playSprite(el, SPRITES.emerge, 1, function () {
    playSprite(el, SPRITES.idle, idleLoops || Infinity, onDone);
  });
}

function loopTime(sp) {
  var t = 0;
  for (var i = 0; i < sp.frames; i++) t += (sp.durations[i] < 20 ? 100 : sp.durations[i]);
  return t;
}

function startPet(el) {
  function go() {
    if (REDUCED) { setPetFrame(el, SPRITES.idle, 0); return; }
    if (DEMO_LOOP) {
      var n = Math.max(3, Math.ceil(3000 / loopTime(SPRITES.idle)));
      var again = function () { playPet(el, again, n); };
      again();
    } else {
      playPet(el);
    }
  }
  if (spritesReady) go(); else spritesWaiting.push(go);
}

/* =====================================================================
   L. GİRİŞ
   ===================================================================== */
/* Tek dokunuş: pati koy / kaldır (hemen, doğrulanmaz, bedava).
   Aynı kareye DOUBLE_TAP_MS içinde 2. dokunuş: 1. dokunuşun değişikliği geri alınır, kare açılır. */
var DOUBLE_TAP_MS = 300;
var lastTap = null;                /* { v, s, t, prev } : son tek dokunuş */
function onCellClick(e) {
  var btn = e.target.closest ? e.target.closest('.cell') : null;
  if (!btn || !canPlay()) return;
  var r = +btn.getAttribute('data-r'), c = +btn.getAttribute('data-c');
  if (MODE === 'tut' && !tutAllows(r, c)) return;
  var v = view.cells[r][c];
  if (v.busy) return;
  var st = S.cells[r][c];
  if (st === 'mouse') { lastTap = null; return; }        /* açık fare: hiçbir şey */
  var now = Date.now();
  if (lastTap && lastTap.v === v && lastTap.s === S && now - lastTap.t <= DOUBLE_TAP_MS) {
    /* çift dokunuş: kareyi aç */
    S.cells[r][c] = lastTap.prev;
    lastTap = null;
    paintCell(r, c);
    if (isMouse(r, c)) revealMouse(r, c);
    else mistake(r, c);
    return;
  }
  lastTap = { v: v, s: S, t: now, prev: st };
  S.cells[r][c] = st === 'paw' ? 'closed' : 'paw';
  paintCell(r, c);
  playPop();
  if (!REDUCED) restartClass(v.img, 'pop');
}

/* ---------- Sesler ---------- */
var SOUNDS = { fare: 'ses-fare.mp3', tap: 'pop-1.mp3', pop1: 'pop-1.mp3', pop2: 'pop-2.mp3', pop3: 'pop-3.mp3', pop4: 'pop-4.mp3', pop5: 'pop-5.mp3', pop6: 'pop-6.mp3', pop7: 'pop-7.mp3', pop8: 'pop-8.mp3' }, SOUND_CACHE = {};
/* pati sesi: 8 pop sırayla, sonra başa */
var POP_I = 0;
function playPop() { POP_I = POP_I % 8 + 1; playSound('pop' + POP_I); }
/* Ayarlar'da "Ses" kapalıysa hiçbir efekt çalmaz; vol verilmezse 1 */
function playSound(name, vol) {
  if (!P.sfx) return;
  try {
    var base = SOUND_CACHE[name];
    if (!base) { base = SOUND_CACHE[name] = new Audio(SOUNDS[name]); base.preload = 'auto'; }
    var a = base.paused ? base : base.cloneNode(true);
    a.volume = vol == null ? 1 : vol;        /* cloneNode ses düzeyini taşımaz: her seferinde ver */
    a.currentTime = 0;
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}
(function () { for (var k in SOUNDS) { try { SOUND_CACHE[k] = new Audio(SOUNDS[k]); SOUND_CACHE[k].preload = 'auto'; } catch (e) {} } })();
/* Ayarlar'da "Titreşim" kapalıysa titremez */
function vibrate(ms) { try { if (P.vibe && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- Arka plan müziği ----------
   Tek Audio, döngüde, %35. Tarayıcı kuralı: ilk dokunuştan önce çalınamaz (unlock).
   want = müzik açık + kilit açık + reklam oynamıyor + sayfa görünür. */
var Music = {
  el: null, unlocked: false, held: false,
  init: function () {
    try { this.el = new Audio('muzik.mp3'); this.el.loop = true; this.el.volume = 0.35; this.el.preload = 'auto'; } catch (e) { this.el = null; }
  },
  sync: function () {
    var a = this.el;
    if (!a) return;
    var want = P.music && this.unlocked && !this.held && !document.hidden;
    if (want && a.paused) { try { var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    else if (!want && !a.paused) a.pause();
  },
  hold: function (on) { this.held = !!on; this.sync(); }      /* reklam sırasında sus */
};
Music.init();
(function () {
  /* kullanıcı etkinleştiren olaylar: dokunuşta pointerup/touchend, farede pointerdown, klavye */
  var evs = ['pointerdown', 'pointerup', 'touchend', 'keydown', 'click'];
  function off() { for (var i = 0; i < evs.length; i++) document.removeEventListener(evs[i], unlock, true); }
  function unlock() {
    Music.unlocked = true;
    if (!P.music) { off(); return; }      /* sonradan açılırsa açma tuşu zaten bir dokunuş */
    Music.sync();
  }
  for (var i = 0; i < evs.length; i++) document.addEventListener(evs[i], unlock, true);
  if (Music.el) Music.el.addEventListener('playing', off);
  document.addEventListener('visibilitychange', function () { Music.sync(); });
})();
/* her tuşa basışta yumuşak pop (kareler hariç: onların 8 pop döngüsü var) */
document.addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('button') : null;
  if (b && !b.classList.contains('cell')) playSound('tap', 0.5);
});

function revealMouse(r, c) {
  S.cells[r][c] = 'mouse';
  playSound('fare');
  S.found++;
  paintCell(r, c);
  if (S.found >= LEVEL.size) onLevelWon();
  else if (MODE === 'tut') tutOnReveal(r, c);
  updateHud();
}

function mistake(r, c) {
  var v = view.cells[r][c], img = v.img;
  v.busy = true;
  S.cells[r][c] = 'paw';                 /* hatalı açılan kare pati olarak kalır */
  paintCell(r, c);
  vibrate(60);
  img.classList.remove('pop');
  if (!REDUCED) { restartClass(img, 'shake'); fx(function () { img.classList.remove('shake'); }, 350); }
  img.classList.add('bad');
  fx(function () { img.classList.remove('bad'); v.busy = false; }, 900);
  if (MODE === 'tut') { tutOnMistake(); return; }       /* öğreticide can gitmez */
  S.lives--;
  S.mistakes++;
  if (MODE === 'play' && LEVEL.L === 1 && P.skippedTutorial && !P.tipShown && S.mistakes >= 2) {
    P.zp = clamp(P.zp - 10, 0, 100);
    P.tipShown = true;
    save();
    showTip();
  }
  if (S.lives <= 0) { S.lives = 0; onGameOver(); }
  updateHud();
}

/* =====================================================================
   M. YARDIMLAR: ampul (ipucu) ve büyüteç
   ===================================================================== */
function useHint() {
  if (!canPlay() || MODE === 'tut') return;
  if (P.bulb <= 0) { showAdOffer('hints'); return; }
  var picks = hintTargets(HINT_MARKS);
  if (!picks.length) return;             /* işaretlenecek kare yok: hak harcanmaz */
  P.bulb--;
  S.bulbs++;
  save();
  for (var i = 0; i < picks.length; i++) markPaw(picks[i][0], picks[i][1]);
  updateHud();
  if (P.bulb === 0) Ads.maybeProactive('hints');
}

function markPaw(r, c) {
  var v = view.cells[r][c];
  S.cells[r][c] = 'paw';
  paintCell(r, c);
  if (!REDUCED) restartClass(v.img, 'pop');
  glowCell(v);
}

function glowCell(v) {
  clearTimeout(v.glowT);
  restartClass(v.btn, 'glow');
  v.glowT = fx(function () { v.btn.classList.remove('glow'); }, 1300);
}

/* Açılmış bir farenin dışladığı mı? (aynı satır, sütun, bölge ya da 8 komşu) */
function excludedByMouse(r, c) {
  for (var k = 0; k < LEVEL.size; k++) {
    var mc = LEVEL.solution[k];
    if (S.cells[k][mc] !== 'mouse') continue;
    if (r === k || c === mc || regionOf(r, c) === regionOf(k, mc) ||
        (Math.abs(r - k) <= 1 && Math.abs(c - mc) <= 1)) return true;
  }
  return false;
}

/* En çok max kare seçer; asla fare karesi seçmez */
function hintTargets(max) {
  var n = LEVEL.size, picks = [], taken = {}, r, c;
  function free(r, c) { return S.cells[r][c] === 'closed' && !isMouse(r, c) && !taken[r * n + c]; }
  function take(r, c) { taken[r * n + c] = true; picks.push([r, c]); }

  /* (a) açık farelerin dışladığı kareler */
  for (r = 0; r < n && picks.length < max; r++)
    for (c = 0; c < n && picks.length < max; c++)
      if (free(r, c) && excludedByMouse(r, c)) take(r, c);

  /* (b) kalan: en az kapalı karesi kalmış satır/sütun/bölgedeki kareler önce */
  while (picks.length < max) {
    var row = [], col = [], reg = [], i;
    for (i = 0; i < n; i++) { row.push(0); col.push(0); reg.push(0); }
    for (r = 0; r < n; r++) for (c = 0; c < n; c++)
      if (S.cells[r][c] === 'closed' && !taken[r * n + c]) { row[r]++; col[c]++; reg[regionOf(r, c)]++; }
    var best = null, bestScore = Infinity;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (!free(r, c)) continue;
      var score = Math.min(row[r], col[c], reg[regionOf(r, c)]);
      if (score < bestScore) { bestScore = score; best = [r, c]; }
    }
    if (!best) break;
    take(best[0], best[1]);
  }
  return picks;
}

function useGlass() {
  if (!canPlay() || MODE === 'tut') return;
  if (P.glass <= 0) { showAdOffer('glasses'); return; }
  /* açılmamış fareler arasından bölgesinde en az (kapalı + pati) kare kalanı */
  var n = LEVEL.size, best = -1, bestLeft = Infinity, r, k, c;
  for (r = 0; r < n; r++) {
    var mc = LEVEL.solution[r];
    if (S.cells[r][mc] === 'mouse') continue;
    var g = regionOf(r, mc), left = 0;
    for (k = 0; k < n; k++) for (c = 0; c < n; c++)
      if (regionOf(k, c) === g && S.cells[k][c] !== 'mouse') left++;
    if (left < bestLeft) { bestLeft = left; best = r; }
  }
  if (best < 0) return;
  P.glass--;
  S.glasses++;
  save();
  revealMouse(best, LEVEL.solution[best]);
  if (P.glass === 0) Ads.maybeProactive('glasses');
}

var TUT_STEPS = [
  { cell: [0, 1], say: 'Her renkte bir fare saklanıyor. Buraya iki kez hızlıca dokun!', teach: true },
  { cell: [1, 3], say: 'Bu renkte tek kare var. İki kez dokun!', teach: false },

  { cell: null, say: 'Son fareyi sen bul!', teach: false }
];

function startTutorial() {
  PUZ = { n: TUT_LEVEL.n, regions: TUT_LEVEL.regions, solution: TUT_LEVEL.solution, tiles: TUT_LEVEL.tiles, L: 0, score: 5 };
  MODE = 'tut';
  LEVEL = toLevel(PUZ);
  tut = { step: 0, busy: false, sayT: 0 };
  resetLevel();
  $('tutBox').hidden = false;
  $('tutSkip').textContent = 'Geç';

  $('tutSkip').setAttribute('data-act', 'tutSkip');
  tutShowStep();
  pregen(1);
}

function tutSay(text) { $('tutText').textContent = text; }

function tutShowStep() {
  var st = TUT_STEPS[tut.step];
  tutSay(st.say);
  $('tutSkip').hidden = tut.step === 0;
  tutPoint(st.cell);
}

function tutPoint(cell) {
  var h = $('tutHand');
  if (!h) return;
  if (!cell) { h.hidden = true; return; }
  var n = LEVEL.size;
  h.style.left = ((cell[1] + 0.5) / n * 100) + '%';
  h.style.top = ((cell[0] + 0.5) / n * 100) + '%';
  h.hidden = false;
}

function tutAllows(r, c) {
  var st = TUT_STEPS[tut.step];
  return !st.cell || (st.cell[0] === r && st.cell[1] === c);
}

function tutOnMistake() {
  tutSay('Burada olamaz. Tekrar dene!');
  clearTimeout(tut.sayT);
  tut.sayT = fx(function () { if (tut) tutSay(TUT_STEPS[tut.step].say); }, 1600);
}

/* fare açıldı: dışlanan kareler sırayla pati olur, sonra sonraki adım */
function tutOnReveal(r, c) {
  var st = TUT_STEPS[tut.step];
  tutPoint(null);
  function next() {
    if (!tut) return;
    tut.step++;
    tut.busy = false;
    tutShowStep();
    updateHud();
  }
  if (!st.teach) { next(); return; }
  var n = LEVEL.size, g = regionOf(r, c), done = {};
  function group(test) {
    var out = [], k, m;
    for (k = 0; k < n; k++) for (m = 0; m < n; m++)
      if (!done[k * n + m] && S.cells[k][m] === 'closed' && test(k, m)) { out.push([k, m]); done[k * n + m] = 1; }
    return out;
  }
  var groups = [
    ['Aynı satırda başka fare olmaz', group(function (k) { return k === r; })],
    ['Aynı sütunda da olmaz', group(function (k, m) { return m === c; })],
    ['Aynı renkte de olmaz', group(function (k, m) { return regionOf(k, m) === g; })],
    ['Fareler birbirine değmez', group(function (k, m) { return Math.abs(k - r) <= 1 && Math.abs(m - c) <= 1; })]
  ];
  tut.busy = true;
  updateHud();
  var t = REDUCED ? 300 : 1300, gi, ci;
  for (gi = 0; gi < groups.length; gi++) {
    if (!groups[gi][1].length) continue;
    (function (gr, at) {
      fx(function () { tutSay(gr[0]); }, at);
      for (ci = 0; ci < gr[1].length; ci++) (function (cell, at2) {
        fx(function () { markPaw(cell[0], cell[1]); }, at2);
      })(gr[1][ci], at + 350 + ci * 120);
    })(groups[gi], t);
    t += 350 + groups[gi][1].length * 120 + 1300;
  }
  fx(function () { tutSay('Tek dokunuş pati koyar ya da kaldırır.'); }, t);
  t += REDUCED ? 600 : 2200;
  fx(next, t);
}

function endTutorialUI() {

/* =====================================================================
   O2. REKLAM KATMANI
   Tek giriş noktası: Ads. Gerçek SDK gelince yalnızca Ads.provider değişir.
   Sağlayıcı sözleşmesi:
     showRewarded(cb, failCb)  -> sonuna kadar izlendiyse cb(), yüklenemedi/yarıda kaldıysa failCb()
     showInterstitial(cb)      -> reklam kapanınca (ya da gösterilemezse) cb()
   Ödüllü yerler (placement): 'can' (can bitti), 'ampul' (ipucu hakkı), 'buyutec' (büyüteç hakkı).
   Sayaçlar: rewardedOffered = teklif tuşu ekrana geldi, rewardedWatched = ödül verildi,
             interstitialShown = geçiş reklamı gösterildi.
   Profil (P.profile):  D = noAds (reklamsız);  en az 5 teklif yoksa B (veri yok);
             izleme oranı >= %60 A, %20–60 B, < %20 C.
   Geçiş reklamı kuralları (interstitialAfterLevel):
     - öğreticide yok, noAds oyuncuda yok, bölüm 4'ten önce yok
     - can bitişinden hemen sonra yok: o bölümde can bittiyse sonraki 1, iki kez bittiyse sonraki 2
       "Sonraki bölüm" reklamsız geçer (adCalm)
     - son reklamdan beri en az 3 dk ve en az GAP bölüm: C = 3 (plandaki gibi), B = 4, A = 5
       (ödüllü izleyen oyuncuyu geçiş reklamıyla daha az yorarız)
   A oyuncusu: bir yardım hakkı 0'a inince bir kereye mahsus "+2 hak" kartı kendiliğinden açılır.
   ===================================================================== */
var AD_SIM_MS = 2000;
var AD_GAP = { A: 5, B: 4, C: 3 };
var AD_MIN_LEVEL = 4, AD_MIN_MS = 3 * 60 * 1000, AD_PROFILE_MIN_OFFERS = 5;

/* SDK yokken yerleşik benzetici: 2 sn "Reklam" kartı + ilerleme çubuğu */
var SimAdProvider = {
  show: function (title, cb) {
    openOverlay(
      '<h2 id="ovTitle">Reklam</h2>' +
      '<p>' + title + '</p>' +
      '<div class="ad-bar" aria-hidden="true"><i></i></div>', false);
    setTimeout(cb, AD_SIM_MS);
  },
  showRewarded: function (cb, failCb) { SimAdProvider.show('Ödülün birazdan geliyor…', cb); },
  showInterstitial: function (cb) { SimAdProvider.show('Birazdan devam ediyoruz…', cb); }
};

var Ads = {
  // TODO: AdMob (Android) / AdSense H5 (web) sağlayıcısı buraya
  provider: SimAdProvider,
  busy: false,

  updateProfile: function () {
    var o = P.counters.rewardedOffered, w = P.counters.rewardedWatched, p;
    if (P.noAds) p = 'D';
    else if (o < AD_PROFILE_MIN_OFFERS) p = 'B';
    else { var r = w / o; p = r >= 0.6 ? 'A' : r >= 0.2 ? 'B' : 'C'; }
    P.profile = p;
    return p;
  },

  /* teklif tuşu ekrana geldi */
  offered: function (placement) {
    P.counters.rewardedOffered++;
    Ads.updateProfile();
    save();
  },

  /* ödüllü reklam: izlenirse onReward(), olmazsa onFail() */
  rewarded: function (placement, onReward, onFail) {
    if (Ads.busy) return;
    Ads.busy = true;
    Music.hold(true);
    function end() { Ads.busy = false; Music.hold(false); }
    Ads.provider.showRewarded(function () {
      end();
      P.counters.rewardedWatched++;
      Ads.updateProfile();
      save();
      onReward();
    }, function () {
      end();
      if (onFail) onFail(); else showAdFail(placement);
    });
  },

  /* bölüm kazanıldı (play kipi): sayaçlar */
  noteWin: function () {
    P.adLevelsSince++;
    if (P.adDeaths >= 2) P.adCalm = Math.max(P.adCalm, 2);
    else if (P.adDeaths >= 1) P.adCalm = Math.max(P.adCalm, 1);
    P.adDeaths = 0;
  },

  /* "Sonraki bölüm"e basıldı: kurallar uygunsa geçiş reklamı, sonra then() */
  interstitialAfterLevel: function (level, then) {
    var prof = Ads.updateProfile(), show = true;
    if (MODE === 'tut' || prof === 'D' || level < AD_MIN_LEVEL || Ads.busy) show = false;
    else if (P.adCalm > 0) { P.adCalm--; show = false; }
    else if (P.adLevelsSince < AD_GAP[prof]) show = false;
    else if (P.adLastAt && Date.now() - P.adLastAt < AD_MIN_MS) show = false;
    if (!show) { save(); then(); return; }
    Ads.busy = true;
    Music.hold(true);
    P.adLastAt = Date.now();
    P.adLevelsSince = 0;
    P.counters.interstitialShown++;
    save();
    Ads.provider.showInterstitial(function () { Ads.busy = false; Music.hold(false); then(); });
  },

  /* A oyuncusu: bir yardım 0'a inince bir kez "+2 hak" kartı */
  maybeProactive: function (kind) {
    if (P.adProactiveDone || Ads.updateProfile() !== 'A') return;
    P.adProactiveDone = true;
    save();
    fx(function () { if (canPlay() && MODE !== 'tut') showAdOffer(kind); }, REDUCED ? 300 : 900);
  }
};

/* =====================================================================
   P. BAŞLAT
   ===================================================================== */
function preload(list, done) {
  var left = list.length;
  function one() { if (--left === 0) done(); }
  if (!left) { done(); return; }
  for (var i = 0; i < list.length; i++) {
    var img = new Image();
    img.onload = one; img.onerror = one;
    img.src = list[i];
  }
}

(function preloadSprites() {
  preload([SPRITES.emerge.src, SPRITES.idle.src], function () {
    spritesReady = true;
    var w = spritesWaiting; spritesWaiting = [];
    for (var i = 0; i < w.length; i++) w[i]();
  });
})();

$('grid').addEventListener('click', onCellClick);
$('grid').addEventListener('dblclick', function (e) { e.preventDefault(); });   /* çift dokunuş yakınlaştırmasın */
$('btnHint').addEventListener('click', useHint);
$('btnGlass').addEventListener('click', useGlass);
$('pause').addEventListener('click', showPause);
$('back').addEventListener('click', function () { if (S && !overlayOpen) ACTIONS.restart(); });
$('settings').addEventListener('click', showSettings);

/* tüm kare resimleri + arayüz yüklenince kaydedilen bölümden (ya da öğreticiden) başlar */
(function boot() {
  var list = [], i;
  for (i = 0; i < TILE_COLORS.length; i++) list.push('kare-' + TILE_COLORS[i] + '.webp', 'pati-' + TILE_COLORS[i] + '.webp');
  list.push('kalp-dolu.webp', 'kalp-bos.webp');
  /* arayüz resimleri + rakamlar */
  list.push('ui-pause.webp', 'ui-fullscreen.webp', 'ui-baslik.webp',
            'ui-yildiz-dolu.webp', 'ui-yildiz-yarim.webp', 'ui-yildiz-bos.webp',
            'ui-para.webp', 'ui-saat.webp', 'ui-pati.webp', 'ui-sayac.webp',
            'ui-rozet.webp', 'ui-arti.webp', 'ui-kart.webp', 'ui-btn-altin.webp',
            'ui-btn-mor.webp', 'ui-parilti.webp', 'rakam-bolu.webp', 'rakam-iki-nokta.webp',
            'ui-ayar.webp', 'ik-ampul.webp', 'ik-buyutec.webp', 'ik-reklam.webp', 'ik-kupa.webp',
            'ik-oynat.webp', 'ik-yeniden.webp', 'ik-ev.webp', 'ik-kapat.webp',
            'ik-muzik.webp', 'ik-muzik-kapali.webp', 'ik-ses.webp', 'ik-ses-kapali.webp',
            'ik-titresim.webp', 'ik-titresim-kapali.webp');
  Ads.updateProfile();
  for (var d = 0; d <= 9; d++) list.push('rakam-' + d + '.webp');
  preload(list, function () {
    if (!P.tutorialDone) startTutorial();
    else startGameLevel(P.level);
    setInterval(function () { if (S) renderTime(); }, 500);
  });
})();

/* Tam ekran tuşu (dikey kalır) */
$('fs').addEventListener('click', function () {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    var p = document.documentElement.requestFullscreen();
    if (p && p.then) p.then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {});
    }).catch(function () {});
  } catch (e) {}
});
</script>
